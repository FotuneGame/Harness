# check, test → build (образ в registry.local) → deploy (imageTag в
# deploy/values-<env>.yaml; Argo CD разворачивает изменения из Git).
# dev — автоматически из основной ветки, stage — вручную оттуда же,
# prod — вручную из тега. Переменная CI/CD GITOPS_TOKEN — project access
# token с ролью Maintainer и правом write_repository.
stages: [check, build, deploy]

.node:
  stage: check
  image: node:24-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]

check:
  extends: .node
  script:
    - npm run lint
    - npm run build

test:
  extends: .node
  script:
    - npm test

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # CA *.local в задачах CI монтирует платформа.
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --registry-certificate "$CI_REGISTRY=/etc/docker/certs.d/registry.local/ca.crt"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

.deploy:
  stage: deploy
  image: alpine:3.22
  script:
    - apk add --no-cache git
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - sed -i '/^imageTag:/d' "deploy/values-$DEPLOY_ENV.yaml"
    - 'echo "imageTag: $CI_COMMIT_SHORT_SHA" >> "deploy/values-$DEPLOY_ENV.yaml"'
    - git diff --quiet && exit 0
    - 'git -c user.name="GitLab CI" -c user.email="ci@gitlab.local" commit -am "deploy $DEPLOY_ENV: $CI_COMMIT_SHORT_SHA"'
    # origin — внутренний адрес GitLab (clone_url Runner): без TLS *.local.
    # ci.skip пропускает pipeline только этого push: в отличие от [skip ci]
    # в сообщении, тег на таком коммите запускает pipeline.
    - git push -o ci.skip "$(git remote get-url origin | sed "s#//[^@]*@#//oauth2:$GITOPS_TOKEN@#")" "$CI_DEFAULT_BRANCH"

deploy-dev:
  extends: .deploy
  variables: { DEPLOY_ENV: dev }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-stage:
  extends: .deploy
  variables: { DEPLOY_ENV: stage }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy-prod:
  extends: .deploy
  variables: { DEPLOY_ENV: prod }
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
