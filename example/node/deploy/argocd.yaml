# Приложение Argo CD (один раз): kubectl apply -f deploy/argocd.yaml.
# Замените group/node-example на путь проекта в GitLab. Для stage и prod —
# копия с именем node-example-stage/-prod и values-stage/-prod.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-example
  namespace: cicd
spec:
  project: default
  source:
    repoURL: http://gitlab-webservice-default.vcs.svc.cluster.local:8181/group/node-example.git
    targetRevision: main
    path: deploy
    helm:
      valueFiles: [values.yaml, values-dev.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
