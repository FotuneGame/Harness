argo-cd:
  server:
    replicas: 1
    resources: { requests: { cpu: 200m, memory: 512Mi } }
  controller:
    replicas: 1
    resources: { requests: { cpu: 200m, memory: 1Gi } }
  repoServer:
    replicas: 1
    resources: { requests: { cpu: 200m, memory: 512Mi } }
  applicationSet:
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 256Mi } }

gitlab-runner:
  concurrent: 5
  jobLimits: { cpu: "2", memory: 2Gi }
