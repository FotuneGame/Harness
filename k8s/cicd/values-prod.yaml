argo-cd:
  server:
    replicas: 2
    resources: { requests: { cpu: 500m, memory: 1Gi } }
  controller:
    replicas: 2
    resources: { requests: { cpu: 500m, memory: 2Gi } }
  repoServer:
    replicas: 2
    resources: { requests: { cpu: 500m, memory: 1Gi } }
  applicationSet:
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 256Mi } }

gitlab-runner:
  concurrent: 10
  jobLimits: { cpu: "4", memory: 4Gi }
