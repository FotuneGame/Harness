{{- range .Values.storage.volumes }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .name | quote }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  capacity:
    storage: {{ .capacity | quote }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local
  {{- with .claim }}
  claimRef:
    namespace: {{ .namespace | quote }}
    name: {{ .name | quote }}
  {{- end }}
  hostPath:
    path: {{ .path | quote }}
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .nodeName | default $.Values.storage.nodeName | quote }}
{{- end }}
