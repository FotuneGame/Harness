apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
{{- $volumes := .Values.volumes }}
{{- range $env := .Values.environments.names }}
{{- range $folder, $settings := $.Values.environments.folders }}
{{- range $settings.volumes }}
{{- $volumes = append $volumes (merge (dict
      "path" (compact (list $folder $env .path) | join "/")
      "claim" (printf "%s-%s/%s" $folder $env .claim)
      "node" $settings.node) .) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $volumes }}
{{- $name := printf "pv-%s" (replace "/" "-" .path) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  capacity:
    storage: {{ .size }}
  accessModes: [{{ .accessMode | default "ReadWriteOnce" }}]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local
  {{- with .claim }}
  claimRef:
    namespace: {{ splitList "/" . | first }}
    name: {{ splitList "/" . | last }}
  {{- end }}
  hostPath:
    path: /volumes/{{ .path }}
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: platform.node
              operator: In
              values: [{{ .node | default "core" }}]
{{- if .hostFiles }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ splitList "/" .claim | last }}
  namespace: {{ splitList "/" .claim | first }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  volumeName: {{ $name }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
