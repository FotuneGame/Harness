# Видеокарта доступна только узлам с долей VRAM (terraform/variables.tf,
# nodes.*.vram_mib; метку platform.gpu=on ставит Terraform). Ansible включает:
#   hami — Ubuntu: поды запрашивают nvidia.com/gpu: 1 и nvidia.com/gpumem (МиБ),
#          HAMi ограничивает им VRAM; доли узлов передаются в
#          hami.devicePlugin.nodeConfiguration.config;
#   nvidia-device-plugin — WSL2: только доступ к GPU, без ограничения VRAM.
hami:
  enabled: true
  fullnameOverride: hami
  scheduler:
    nodeSelector:
      platform.node: core
    kubeScheduler:
      image:
        registry: registry.k8s.io
        repository: kube-scheduler
    service:
      type: ClusterIP
    # Сертификат webhook: официальный образ (тот же, что у ingress-nginx)
    # вместо образа из личного репозитория Docker Hub.
    patch:
      imageNew:
        registry: registry.k8s.io
        repository: ingress-nginx/kube-webhook-certgen
        tag: v1.6.9
      nodeSelector:
        platform.node: core
  devicePlugin:
    # null убирает метку gpu=on из значений chart по умолчанию.
    nvidiaNodeSelector:
      gpu: null
      platform.gpu: "on"
    tolerations:
      - operator: Exists
    service:
      type: ClusterIP

nvidia-device-plugin:
  enabled: false
  fullnameOverride: nvidia-device-plugin
  nodeSelector:
    platform.gpu: "on"
  # По умолчанию chart требует метки Node Feature Discovery, которых в minikube нет.
  affinity: null
  tolerations:
    - operator: Exists
