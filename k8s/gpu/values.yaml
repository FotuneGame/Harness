# Только узлы с меткой platform.gpu=on. Доли VRAM для HAMi передаёт Ansible
# (hami.devicePlugin.nodeConfiguration.config).
hami:
  enabled: true
  fullnameOverride: hami
  scheduler:
    nodeSelector:
      platform.node: core
    kubeScheduler:
      image:
        registry: registry.k8s.io
        repository: kube-scheduler
    service:
      type: ClusterIP
    # Официальный образ вместо личного репозитория Docker Hub.
    patch:
      imageNew:
        registry: registry.k8s.io
        repository: ingress-nginx/kube-webhook-certgen
        tag: v1.6.9
      nodeSelector:
        platform.node: core
  devicePlugin:
    # null убирает метку gpu=on из значений chart по умолчанию.
    nvidiaNodeSelector:
      gpu: null
      platform.gpu: "on"
    tolerations:
      - operator: Exists
    service:
      type: ClusterIP

nvidia-device-plugin:
  enabled: false
  fullnameOverride: nvidia-device-plugin
  nodeSelector:
    platform.gpu: "on"
  # По умолчанию chart требует метки Node Feature Discovery, которых в minikube нет.
  affinity: null
  # Видеокарту делят llama.cpp трёх окружений (dev, stage, prod).
  config:
    default: shared
    map:
      shared: |
        version: v1
        sharing:
          timeSlicing:
            resources:
              - name: nvidia.com/gpu
                replicas: 3
  tolerations:
    - operator: Exists
