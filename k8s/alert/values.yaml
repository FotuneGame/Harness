replicaCount: 1

persistence:
  enabled: true
  storageClass: local
  accessModes:
    - ReadWriteOnce
  size: 1Gi

resources:
  requests:
    cpu: 50m
    memory: 64Mi

ingress:
  enabled: false

config:
  global:
    resolve_timeout: 5m
  route:
    group_by:
      - alertname
      - namespace
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 3h
    receiver: default
  receivers:
    - name: default
