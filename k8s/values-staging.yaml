namespaces:
  - proxy
  - vcs
  - cicd
  - db
  - mb
  - llm
  - secret
  - acl
  - backup
  - logs

storage:
  nodeName: minikube
  volumes:
    - name: pv-db-pg
      capacity: 5Gi
      claim:
        namespace: db
        name: data-postgresql-0
      path: /volumes/db/pg
    - name: pv-db-pgadmin
      capacity: 2Gi
      claim:
        namespace: db
        name: pgadmin
      path: /volumes/db/pgadmin
    - name: pv-db-redis
      capacity: 2Gi
      claim:
        namespace: db
        name: redis-data-redis-master-0
      path: /volumes/db/redis
    - name: pv-db-ch
      capacity: 10Gi
      claim:
        namespace: db
        name: data-clickhouse-shard0-0
      path: /volumes/db/ch
    - name: pv-db-es
      capacity: 10Gi
      claim:
        namespace: db
        name: data-elasticsearch-master-0
      path: /volumes/db/es
    - name: pv-mb
      capacity: 5Gi
      claim:
        namespace: mb
        name: data-kafka-controller-0
      path: /volumes/mb
    - name: pv-llm-llama
      capacity: 30Gi
      nodeName: minikube-m02
      claim:
        namespace: llm
        name: models-llama-0
      path: /volumes/llm/llama
    - name: pv-llm-webui
      capacity: 2Gi
      nodeName: minikube-m02
      claim:
        namespace: llm
        name: open-webui
      path: /volumes/llm/webui
    - name: pv-secret
      capacity: 2Gi
      claim:
        namespace: secret
        name: data-vault-0
      path: /volumes/secret
    - name: pv-vcs-registry
      capacity: 10Gi
      claim:
        namespace: vcs
        name: data-registry-0
      path: /volumes/vcs/registry
    - name: pv-backups
      capacity: 20Gi
      claim:
        namespace: backup
        name: minio
      path: /volumes/backups
    - name: pv-logs-grafana
      capacity: 2Gi
      claim:
        namespace: logs
        name: logs-grafana
      path: /volumes/logs/grafana
    - name: pv-logs-prometheus
      capacity: 10Gi
      path: /volumes/logs/prometheus
    - name: pv-logs-alertmanager
      capacity: 1Gi
      path: /volumes/logs/alertmanager
    - name: pv-vcs-gitaly
      capacity: 10Gi
      path: /volumes/vcs/gitaly
      labels:
        volume: gitaly
