namespaces:
  - proxy
  - vcs
  - cicd
  - db
  - mb
  - llm
  - secret
  - acl
  - backup
  - logs

storage:
  nodeName: minikube
  volumes:
    - name: pv-db-pg
      capacity: 5Gi
      claim:
        namespace: db
        name: data-postgresql-0
      path: /volumes/db/pg
    - name: pv-db-redis
      capacity: 2Gi
      claim:
        namespace: db
        name: data-redis-0
      path: /volumes/db/redis
    - name: pv-db-ch
      capacity: 10Gi
      claim:
        namespace: db
        name: data-clickhouse-0
      path: /volumes/db/ch
    - name: pv-mb
      capacity: 5Gi
      claim:
        namespace: mb
        name: data-kafka-0
      path: /volumes/mb
    - name: pv-llm-ollama
      capacity: 30Gi
      claim:
        namespace: llm
        name: models-ollama-0
      path: /volumes/llm/ollama
    - name: pv-secret
      capacity: 2Gi
      claim:
        namespace: secret
        name: data-vault-0
      path: /volumes/secret
    - name: pv-acl
      capacity: 2Gi
      claim:
        namespace: acl
        name: data-keycloak-0
      path: /volumes/acl
    - name: pv-vcs-registry
      capacity: 10Gi
      claim:
        namespace: vcs
        name: data-registry-0
      path: /volumes/vcs/registry
    - name: pv-backups
      capacity: 20Gi
      claim:
        namespace: backup
        name: data-minio-0
      path: /volumes/backups
    - name: pv-logs-grafana
      capacity: 2Gi
      claim:
        namespace: logs
        name: logs-grafana
      path: /volumes/logs/grafana
    - name: pv-logs-prometheus
      capacity: 10Gi
      path: /volumes/logs/prometheus
    - name: pv-logs-alertmanager
      capacity: 1Gi
      path: /volumes/logs/alertmanager
    - name: pv-vcs-gitaly
      capacity: 10Gi
      path: /volumes/vcs/gitaly
      labels:
        volume: gitaly
