{{- if .Values.allServices }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
spec:
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      nodeSelector:
        platform.node: core
      containers:
        - name: redisinsight
          image: {{ .Values.redisinsight.image }}
          ports:
            - containerPort: 5540
          env:
            - { name: RI_PROXY_PATH, value: {{ .Values.redisinsight.proxyPath | quote }} }
            - { name: RI_REDIS_HOST, value: redis-master }
            - { name: RI_REDIS_PORT, value: "6379" }
            - { name: RI_REDIS_ALIAS, value: redis }
            - name: RI_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-credentials, key: password }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
spec:
  selector:
    app: redisinsight
  ports:
    - port: 5540
{{- end }}
