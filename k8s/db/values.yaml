# Образы Bitnami — в bitnamilegacy/ (allowInsecureImages); docker.io — через зеркало.
global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

postgresql:
  fullnameOverride: postgresql
  auth:
    enablePostgresUser: true
    # Роли и базы приложений создаёт primary.initdb.scripts.
    username: ""
    database: ""
    existingSecret: postgresql-credentials
    secretKeys:
      adminPasswordKey: password
  primary:
    # Миграции GitLab: иначе ERROR: out of shared memory.
    extendedConfiguration: |
      max_locks_per_transaction = 512
    # Восстановление после сбоя на медленном диске (WSL) занимает минуты.
    startupProbe:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    nodeSelector:
      platform.node: core
    persistence:
      storageClass: local
      size: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    extraEnvVars:
      - name: GITLAB_DB_USER
        valueFrom:
          secretKeyRef: { name: gitlab-db-credentials, key: username }
      - name: GITLAB_DB_PASSWORD
        valueFrom:
          secretKeyRef: { name: gitlab-db-credentials, key: password }
      - name: KEYCLOAK_DB_USER
        valueFrom:
          secretKeyRef: { name: keycloak-db-credentials, key: username }
      - name: KEYCLOAK_DB_PASSWORD
        valueFrom:
          secretKeyRef: { name: keycloak-db-credentials, key: password }
      - name: POSTGRES_EXPORTER_USER
        valueFrom:
          secretKeyRef: { name: postgres-exporter-credentials, key: username }
      - name: POSTGRES_EXPORTER_PASSWORD
        valueFrom:
          secretKeyRef: { name: postgres-exporter-credentials, key: password }
    initdb:
      scripts:
        init.sql: |
          \getenv gitlab_user GITLAB_DB_USER
          \getenv gitlab_password GITLAB_DB_PASSWORD
          \getenv keycloak_user KEYCLOAK_DB_USER
          \getenv keycloak_password KEYCLOAK_DB_PASSWORD
          \getenv exporter_user POSTGRES_EXPORTER_USER
          \getenv exporter_password POSTGRES_EXPORTER_PASSWORD
          CREATE ROLE :"gitlab_user" LOGIN PASSWORD :'gitlab_password';
          CREATE ROLE :"keycloak_user" LOGIN PASSWORD :'keycloak_password';
          CREATE ROLE :"exporter_user" LOGIN PASSWORD :'exporter_password';
          GRANT pg_monitor TO :"exporter_user";
          CREATE DATABASE gitlabhq_production OWNER :"gitlab_user";
          CREATE DATABASE keycloak OWNER :"keycloak_user";
          \connect gitlabhq_production
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
  volumePermissions:
    enabled: true

redis:
  fullnameOverride: redis
  architecture: standalone
  auth:
    enabled: true
    existingSecret: redis-credentials
    existingSecretPasswordKey: password
  master:
    nodeSelector:
      platform.node: core
    persistence:
      storageClass: local
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  volumePermissions:
    enabled: true

clickhouse:
  fullnameOverride: clickhouse
  image:
    repository: bitnamilegacy/clickhouse
  replicaCount: 1
  shards: 1
  keeper:
    enabled: false
  # Логин (auth.username) — из Vault, его передаёт Ansible.
  auth:
    existingSecret: clickhouse-credentials
    existingSecretKey: password
  nodeSelector:
    platform.node: core
  persistence:
    storageClass: local
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  metrics:
    enabled: true

elasticsearch:
  fullnameOverride: elasticsearch
  image:
    repository: bitnamilegacy/elasticsearch
  security:
    enabled: false
  # Без mmap не нужен привилегированный sysctl vm.max_map_count.
  extraConfig:
    node:
      store:
        allow_mmap: false
  sysctlImage:
    enabled: false
  # Один узел — и master, и data: без роли data индексы негде хранить.
  master:
    masterOnly: false
    replicaCount: 1
    heapSize: 512m
    nodeSelector:
      platform.node: core
    persistence:
      storageClass: local
      size: 10Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
  # Версионные образы os-shell есть только в bitnamilegacy/.
  volumePermissions:
    enabled: true
    image:
      repository: bitnamilegacy/os-shell

pgadmin4:
  fullnameOverride: pgadmin
  existingSecret: pgadmin-credentials
  secretKeys:
    pgadminPasswordKey: password
  # Логин (env.email) — из Vault, его передаёт Ansible.
  nodeSelector:
    platform.node: core
  persistentVolume:
    enabled: true
    storageClass: local
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

# Официального chart нет (templates/).
redisinsight:
  image: redis/redisinsight:latest
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

# Учётки приложений (Vault app/postgresql, app/clickhouse): база с именем логина
# и полные права только на неё. Образы — те же, что у PostgreSQL и ClickHouse.
appAccounts:
  postgresqlImage: docker.io/bitnami/postgresql:latest
  clickhouseImage: docker.io/bitnamilegacy/clickhouse:25.7.5-debian-12-r0
