# Базы данных окружения (namespace db-<env>, узел core). Пароли — Secret из
# Vault db/<env>/*, логины передаёт Ansible. GitLab работает на PostgreSQL и
# Redis окружения prod (values-prod.yaml). Образы Bitnami — в bitnamilegacy/
# (allowInsecureImages).
# false — только PostgreSQL и Redis (db-prod для GitLab, пока окружение prod не
# развёрнуто): ClickHouse, Elasticsearch, Kibana, pgAdmin и RedisInsight не ставятся.
allServices: true

global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

# Владелец базы приложений — логин из Vault db/<env>/postgresql, суперпользователь
# postgres — ключ postgres-password там же. Базы сервисов из других namespace —
# serviceDatabases.
postgresql:
  fullnameOverride: postgresql
  auth:
    enablePostgresUser: true
    existingSecret: postgresql-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    nodeSelector: &core { platform.node: core }
    networkPolicy:
      enabled: false
    # Восстановление после сбоя на медленном диске (WSL) занимает минуты.
    startupProbe:
      enabled: true
      periodSeconds: 10
      failureThreshold: 60
    persistence:
      storageClass: local
      size: 5Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
  # Метрики для Prometheus (ServiceMonitor) — дашборд Platform overview в Grafana.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  volumePermissions:
    enabled: true

redis:
  fullnameOverride: redis
  architecture: standalone
  networkPolicy:
    enabled: false
  auth:
    existingSecret: redis-credentials
    existingSecretPasswordKey: password
  master:
    nodeSelector: *core
    persistence:
      storageClass: local
      size: 2Gi
    resources:
      requests: { cpu: 25m, memory: 64Mi }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  volumePermissions:
    enabled: true

# Базы сервисов из других namespace (база: Secret с логином и паролем роли из
# Vault, расширения PostgreSQL). Роль и база создаются, а пароль роли берётся из
# Vault при каждой установке (templates/service-databases.yaml).
serviceDatabases:
  image: docker.io/bitnami/postgresql:latest
  databases:
    keycloak: { secret: keycloak-db-credentials }

# База ClickHouse с именем логина (templates/clickhouse-database.yaml).
clickhouseDatabase:
  image: curlimages/curl:8.12.1

# Официального chart нет (templates/redisinsight.yaml). proxyPath — путь веб-интерфейса.
redisinsight:
  image: redis/redisinsight:latest
  proxyPath: ""

clickhouse:
  fullnameOverride: clickhouse
  image:
    repository: bitnamilegacy/clickhouse
  replicaCount: 1
  shards: 1
  keeper:
    enabled: false
  networkPolicy:
    enabled: false
  auth:
    existingSecret: clickhouse-credentials
    existingSecretKey: password
  nodeSelector: *core
  persistence:
    storageClass: local
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

elasticsearch:
  fullnameOverride: elasticsearch
  image:
    repository: bitnamilegacy/elasticsearch
  security:
    enabled: false
  # Без mmap не нужен привилегированный sysctl vm.max_map_count.
  extraConfig:
    node:
      store:
        allow_mmap: false
  sysctlImage:
    enabled: false
  # Один узел — и master, и data.
  master:
    masterOnly: false
    replicaCount: 1
    heapSize: 384m
    nodeSelector: *core
    networkPolicy:
      enabled: false
    persistence:
      storageClass: local
      size: 10Gi
    resources:
      requests: { cpu: 100m, memory: 640Mi }
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
  volumePermissions:
    enabled: true
    image:
      repository: bitnamilegacy/os-shell

kibana:
  fullnameOverride: kibana
  image:
    repository: bitnamilegacy/kibana
    tag: 9.1.2-debian-12-r0
  elasticsearch:
    hosts: [elasticsearch]
    port: "9200"
  # Путь веб-интерфейса — configuration.server.basePath в values-<env>.yaml.
  configuration:
    server:
      rewriteBasePath: true
  persistence:
    enabled: false
  networkPolicy:
    enabled: false
  extraEnvVars:
    - { name: NODE_OPTIONS, value: --max-old-space-size=768 }
  # Запуск при загруженном узле дольше проверки liveness (2 минуты).
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 60
  nodeSelector: *core
  resources:
    requests: { cpu: 50m, memory: 640Mi }

pgadmin4:
  fullnameOverride: pgadmin
  existingSecret: pgadmin-credentials
  secretKeys:
    pgadminPasswordKey: password
  # Путь веб-интерфейса — env.contextPath в values-<env>.yaml.
  networkPolicy:
    enabled: false
  serverDefinitions:
    enabled: true
    servers:
      postgresql:
        Name: postgresql
        Group: Servers
        Host: postgresql
        Port: 5432
        SSLMode: prefer
  nodeSelector: *core
  persistentVolume:
    enabled: true
    storageClass: local
    size: 1Gi
  resources:
    requests: { cpu: 25m, memory: 192Mi }
