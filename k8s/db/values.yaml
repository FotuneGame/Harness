# false — только PostgreSQL и Redis (db-prod для GitLab без окружения prod).
allServices: true

global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

postgresql:
  fullnameOverride: postgresql
  auth:
    enablePostgresUser: true
    existingSecret: postgresql-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    nodeSelector: &core { platform.node: core }
    networkPolicy:
      enabled: false
    # Восстановление после сбоя на медленном диске (WSL) занимает минуты.
    startupProbe:
      enabled: true
      periodSeconds: 10
      failureThreshold: 60
    persistence:
      storageClass: local
      size: 5Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  volumePermissions:
    enabled: true

redis:
  fullnameOverride: redis
  architecture: standalone
  networkPolicy:
    enabled: false
  auth:
    existingSecret: redis-credentials
    existingSecretPasswordKey: password
  master:
    nodeSelector: *core
    persistence:
      storageClass: local
      size: 2Gi
    resources:
      requests: { cpu: 25m, memory: 64Mi }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  volumePermissions:
    enabled: true

serviceDatabases:
  image: docker.io/bitnami/postgresql:latest
  databases:
    keycloak: { secret: keycloak-db-credentials }

clickhouseDatabase:
  image: curlimages/curl:8.12.1

redisinsight:
  image: redis/redisinsight:latest
  proxyPath: ""

clickhouse:
  fullnameOverride: clickhouse
  image:
    repository: bitnamilegacy/clickhouse
  replicaCount: 1
  shards: 1
  keeper:
    enabled: false
  networkPolicy:
    enabled: false
  auth:
    existingSecret: clickhouse-credentials
    existingSecretKey: password
  nodeSelector: *core
  persistence:
    storageClass: local
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

elasticsearch:
  fullnameOverride: elasticsearch
  image:
    repository: bitnamilegacy/elasticsearch
  security:
    enabled: false
  # Без mmap не нужен привилегированный sysctl vm.max_map_count.
  extraConfig:
    node:
      store:
        allow_mmap: false
  sysctlImage:
    enabled: false
  master:
    masterOnly: false
    replicaCount: 1
    heapSize: 384m
    nodeSelector: *core
    networkPolicy:
      enabled: false
    persistence:
      storageClass: local
      size: 10Gi
    resources:
      requests: { cpu: 100m, memory: 640Mi }
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
  volumePermissions:
    enabled: true
    image:
      repository: bitnamilegacy/os-shell

kibana:
  fullnameOverride: kibana
  image:
    repository: bitnamilegacy/kibana
    tag: 9.1.2-debian-12-r0
  elasticsearch:
    hosts: [elasticsearch]
    port: "9200"
  configuration:
    server:
      rewriteBasePath: true
  persistence:
    enabled: false
  networkPolicy:
    enabled: false
  extraEnvVars:
    - { name: NODE_OPTIONS, value: --max-old-space-size=768 }
  # Запуск при загруженном узле дольше проверки liveness (2 минуты).
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 60
  nodeSelector: *core
  resources:
    requests: { cpu: 50m, memory: 640Mi }

pgadmin4:
  fullnameOverride: pgadmin
  existingSecret: pgadmin-credentials
  secretKeys:
    pgadminPasswordKey: password
  networkPolicy:
    enabled: false
  serverDefinitions:
    enabled: true
    servers:
      postgresql:
        Name: postgresql
        Group: Servers
        Host: postgresql
        Port: 5432
        SSLMode: prefer
  nodeSelector: *core
  persistentVolume:
    enabled: true
    storageClass: local
    size: 1Gi
  resources:
    requests: { cpu: 25m, memory: 192Mi }
