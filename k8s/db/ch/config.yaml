apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: db
data:
  CLICKHOUSE_USER: default
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
  prometheus.xml: |
    <clickhouse>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>9363</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
      </prometheus>
    </clickhouse>
