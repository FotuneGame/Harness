apiVersion: v2
name: db
description: Базы данных окружения (db-<env>) с веб-интерфейсами; prod — ещё и для GitLab
type: application
version: 0.3.0
dependencies:
  - name: postgresql
    version: 18.12.4
    repository: oci://registry-1.docker.io/bitnamicharts
  - name: redis
    version: 28.3.1
    repository: oci://registry-1.docker.io/bitnamicharts
  - name: clickhouse
    version: 9.4.4
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: allServices
  - name: elasticsearch
    version: 22.1.6
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: allServices
  - name: kibana
    version: 12.1.9
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: allServices
  - name: pgadmin4
    version: 1.70.4
    repository: https://helm.runix.net
    condition: allServices
