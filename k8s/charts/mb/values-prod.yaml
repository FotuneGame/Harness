# Kafka устанавливается как зависимость chart (Chart.yaml).
# Образы версий Bitnami перенесены из bitnami/ в bitnamilegacy/, поэтому указан
# этот репозиторий, а global.security.allowInsecureImages разрешает образы вне bitnami/.
global:
  security:
    allowInsecureImages: true

# Kafka в режиме KRaft: один узел совмещает роли controller и broker.
# Service kafka:9092, StatefulSet kafka-controller, PVC data-kafka-controller-0.
kafka:
  enabled: true
  fullnameOverride: kafka
  image:
    repository: bitnamilegacy/kafka
  clusterId: MkU3OEVBNTcwNTJENDM2Qk
  # Слушатели без TLS и SASL: доступ только внутри кластера.
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  # Один узел: внутренние топики Kafka не могут иметь фактор репликации > 1.
  overrideConfiguration:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    group.initial.rebalance.delay.ms: 0
  controller:
    replicaCount: 1
    nodeSelector:
      platform.node: core
    persistence:
      storageClass: local
      size: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
  broker:
    replicaCount: 0

# Kafka UI остаётся локальным шаблоном.
env:
  kafkaUi:
    KAFKA_CLUSTERS_0_NAME: local
    KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka.mb.svc.cluster.local:9092
