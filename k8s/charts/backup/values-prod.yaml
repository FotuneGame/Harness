schedule:
  namespaces:
    - db
    - mb
    - llm
    - vcs
    - secret
    - acl
    - logs
  backup: "0 2 * * *"
  check: "0 3 * * 0"
  prune: "0 4 * * 0"
  keepLast: 7
  keepDaily: 7

# k8up устанавливается как зависимость chart (Chart.yaml).
k8up:
  enabled: true
  # Имена ресурсов: k8up, k8up-metrics, k8up-cleanup.
  fullnameOverride: k8up
  nodeSelector:
    platform.node: core
  envVars:
    - name: BACKUP_GLOBALREPOPASSWORD
      valueFrom:
        secretKeyRef:
          name: k8up-restic
          key: password
    - name: BACKUP_GLOBALACCESSKEYID
      valueFrom:
        secretKeyRef:
          name: k8up-s3
          key: accessKeyID
    - name: BACKUP_GLOBALSECRETACCESSKEY
      valueFrom:
        secretKeyRef:
          name: k8up-s3
          key: secretAccessKey
    - name: BACKUP_GLOBALS3ENDPOINT
      value: http://minio.backup.svc.cluster.local:9000
    - name: BACKUP_GLOBALS3BUCKET
      value: backups
