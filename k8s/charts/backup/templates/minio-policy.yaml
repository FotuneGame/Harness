apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-policy
  namespace: {{ .Release.Namespace }}
data:
  gitlab-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads",
            "s3:GetBucketLocation"
          ],
          "Resource": [
            "arn:aws:s3:::gitlab-artifacts",
            "arn:aws:s3:::gitlab-lfs",
            "arn:aws:s3:::gitlab-uploads",
            "arn:aws:s3:::gitlab-packages",
            "arn:aws:s3:::gitlab-pages"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": [
            "arn:aws:s3:::gitlab-artifacts/*",
            "arn:aws:s3:::gitlab-lfs/*",
            "arn:aws:s3:::gitlab-uploads/*",
            "arn:aws:s3:::gitlab-packages/*",
            "arn:aws:s3:::gitlab-pages/*"
          ]
        }
      ]
    }
  k8up-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket",
            "s3:ListBucketMultipartUploads",
            "s3:GetBucketLocation"
          ],
          "Resource": ["arn:aws:s3:::backups"]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": ["arn:aws:s3:::backups/*"]
        }
      ]
    }
