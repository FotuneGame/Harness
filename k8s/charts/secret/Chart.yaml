apiVersion: v2
name: secret
description: Vault, Vault Secrets Operator resources and Vault policies
type: application
version: 0.1.0
dependencies:
  - name: vault
    version: 0.34.1
    repository: https://helm.releases.hashicorp.com
    condition: vault.enabled
  - name: vault-secrets-operator
    version: 1.6.0
    repository: https://helm.releases.hashicorp.com
    condition: vault-secrets-operator.enabled
