  namespace: {{ .Values.namespaces.backup | quote }}
spec:
  address: {{ .Values.vault.address | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: {{ .Values.namespaces.backup | quote }}
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault
  kubernetes:
    role: platform-backup
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: minio-credentials
  namespace: {{ .Values.namespaces.backup | quote }}
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: backup/minio
  refreshAfter: 60s
  destination:
    create: true
    name: minio-secret
    # Чарт minio ожидает в существующем Secret ключи rootUser/rootPassword.
    transformation:
      templates:
        rootUser:
          text: '{{ `{{ get .Secrets "MINIO_ROOT_USER" }}` }}'
        rootPassword:
          text: '{{ `{{ get .Secrets "MINIO_ROOT_PASSWORD" }}` }}'
---
