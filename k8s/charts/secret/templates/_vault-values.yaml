server:
  standalone:
    enabled: true
    config: |
      ui            = true
      disable_mlock = true
      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::1]:8201"
        tls_disable     = 1
      }
      storage "file" {
        path = "/vault/data"
      }
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname = true
      }
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: local
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  ui:
    enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
