namespaces:
  db: db
  vcs: vcs
  acl: acl
  cicd: cicd
  backup: backup
  logs: logs

# Vault и Vault Secrets Operator устанавливаются как зависимости chart (Chart.yaml).
vault:
  enabled: true
  # Имена ресурсов Vault: StatefulSet/Service vault, pod vault-0.
  fullnameOverride: vault
  # Адрес Vault для VaultConnection в этом же chart.
  address: http://vault.secret.svc.cluster.local:8200
  injector:
    nodeSelector:
      platform.node: core
  server:
    nodeSelector:
      platform.node: core
    standalone:
      enabled: true
      config: |
        ui            = true
        disable_mlock = true
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::1]:8201"
          tls_disable     = 1
        }
        storage "file" {
          path = "/vault/data"
        }
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: local
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    ui:
      enabled: true
    service:
      type: ClusterIP
    ingress:
      enabled: false

vault-secrets-operator:
  enabled: true
  # Имена ресурсов оператора сохраняются при любом имени релиза.
  fullnameOverride: vault-secrets-operator
  controller:
    nodeSelector:
      platform.node: core
