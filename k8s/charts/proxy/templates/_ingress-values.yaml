controller:
  replicaCount: 1
  service:
    type: LoadBalancer
    enableHttp: true
    enableHttps: true
  ingressClassResource:
    name: nginx
    enabled: true
    default: false
  config:
    use-forwarded-headers: "false"
    proxy-body-size: "100m"
    limit-req-status-code: "429"
    limit-conn-status-code: "429"
    client-header-timeout: "10"
    client-body-timeout: "30"
    keep-alive: "30"
  metrics:
    enabled: true
  admissionWebhooks:
    enabled: true
