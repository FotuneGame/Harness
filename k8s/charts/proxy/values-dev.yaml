namespaces:
  db: db
  mb: mb
  llm: llm
  secret: secret
  acl: acl
  vcs: vcs
  logs: logs
  cicd: cicd

tls:
  secretName: local-wildcard-tls

# ingress-nginx устанавливается как зависимость chart (Chart.yaml).
ingress-nginx:
  enabled: true
  # Имя Service контроллера: ingress-nginx-controller.
  fullnameOverride: ingress-nginx
  controller:
    nodeSelector:
      platform.node: core
    replicaCount: 1
    image:
      digest: ""
    service:
      type: ClusterIP
      enableHttp: true
      enableHttps: true
    ingressClassResource:
      name: nginx
      enabled: true
      default: false
    config:
      ssl-redirect: "true"
      use-forwarded-headers: "false"
      proxy-body-size: "100m"
      limit-req-status-code: "429"
      limit-conn-status-code: "429"
      client-header-timeout: "10"
      client-body-timeout: "30"
      keep-alive: "30"
    metrics:
      enabled: true
    admissionWebhooks:
      enabled: true
