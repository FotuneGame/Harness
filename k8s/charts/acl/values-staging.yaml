# Keycloak устанавливается как зависимость chart (Chart.yaml).
# Образы версий Bitnami перенесены из bitnami/ в bitnamilegacy/, поэтому указан
# этот репозиторий, а global.security.allowInsecureImages разрешает образы вне bitnami/.
global:
  security:
    allowInsecureImages: true

# Service keycloak:8080, StatefulSet keycloak.
keycloak:
  enabled: true
  fullnameOverride: keycloak
  image:
    repository: bitnamilegacy/keycloak
  # Ингресс проксирует запросы, поэтому порт Service оставлен 8080.
  service:
    ports:
      http: 8080
  # За TLS отвечает ingress, Keycloak работает по HTTP.
  proxyHeaders: xforwarded
  production: false
  # Пароли берутся из Secret, созданного Vault Secrets Operator.
  usePasswordFiles: false
  auth:
    existingSecret: keycloak-secret
    passwordSecretKey: KEYCLOAK_ADMIN_PASSWORD
  extraEnvVars:
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: keycloak-secret
          key: KEYCLOAK_ADMIN
  # Внешняя база — PostgreSQL чарта db (sub-chart в acl не нужен).
  postgresql:
    enabled: false
  externalDatabase:
    host: postgresql.db.svc.cluster.local
    port: 5432
    user: keycloak
    database: keycloak
    existingSecret: keycloak-secret
    existingSecretPasswordKey: KC_DB_PASSWORD
  nodeSelector:
    platform.node: core
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
