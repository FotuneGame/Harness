# Container Registry (ресурсы родительского chart).
env:
  registry:
    REGISTRY_HTTP_ADDR: ":5000"
    REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    REGISTRY_STORAGE_DELETE_ENABLED: "true"
    REGISTRY_AUTH_TOKEN_REALM: https://gitlab.local/jwt/auth
    REGISTRY_AUTH_TOKEN_SERVICE: container_registry
    REGISTRY_AUTH_TOKEN_ISSUER: gitlab-issuer
    REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /etc/docker/registry/certificate.crt

# GitLab устанавливается как зависимость chart (Chart.yaml).
gitlab:
  enabled: true
  global:
    nodeSelector:
      platform.node: core
    edition: ce
    hosts:
      domain: local
      registry:
        name: registry.local
      https: true
    registry:
      host: registry.local
      enabled: true
      api:
        protocol: http
        serviceName: registry
        port: 5000
    ingress:
      enabled: true
      class: nginx
      provider: nginx
      configureCertmanager: false
      annotations:
        nginx.ingress.kubernetes.io/limit-rps: "20"
        nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
        nginx.ingress.kubernetes.io/limit-connections: "30"
        nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      tls:
        enabled: true
        secretName: local-wildcard-tls
    appConfig:
      object_store:
        enabled: true
        connection:
          secret: gitlab-object-storage
          key: connection
      lfs:
        enabled: true
      artifacts:
        enabled: true
      uploads:
        enabled: true
      packages:
        enabled: true
    psql:
      host: postgresql.db.svc.cluster.local
      port: 5432
      username: gitlab
      database: gitlabhq_production
      password:
        secret: gitlab-postgresql-password
        key: postgresql-password
    redis:
      host: redis.db.svc.cluster.local
      port: 6379
      auth:
        enabled: true
        secret: redis-secret
        key: REDIS_PASSWORD
  nginx-ingress:
    enabled: false
  installCertmanager: false
  certmanager-issuer:
    email: infra-alerts@example.com
  prometheus:
    install: false
  gitlab-runner:
    install: false
  postgresql:
    install: false
  redis:
    install: false
  # Registry устанавливается ресурсами этого chart, а не сабчартом GitLab.
  registry:
    enabled: false
    tokenIssuer: gitlab-issuer
  gitlab:
    webservice:
      minReplicas: 2
      maxReplicas: 5
      resources:
        requests:
          cpu: 1
          memory: 4Gi
    sidekiq:
      minReplicas: 2
      maxReplicas: 5
      resources:
        requests:
          cpu: 1
          memory: 4Gi
    gitaly:
      persistence:
        size: 10Gi
        storageClass: local
        matchLabels:
          volume: gitaly
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
  gitlab-shell:
    minReplicas: 1
