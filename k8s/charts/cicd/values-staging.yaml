argo-cd:
  enabled: true
  fullnameOverride: argocd
  global:
    domain: argocd.local
    nodeSelector:
      platform.node: core
  configs:
    cm:
      url: http://argocd.local
  server:
    insecure: true
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
  controller:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
  applicationSet:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

gitlab-runner:
  enabled: true
  nodeSelector:
    platform.node: core
  gitlabUrl: http://gitlab-webservice-default.vcs.svc.cluster.local:8181
  concurrent: 5
  rbac:
    create: true
  runners:
    secret: gitlab-runner-secret
    config: |
      [[runners]]
        clone_url = "http://gitlab-webservice-default.vcs.svc.cluster.local:8181"
        [runners.kubernetes]
          namespace = "cicd"
          image = "alpine:latest"
          privileged = false
          cpu_limit = "2"
          memory_limit = "2Gi"
