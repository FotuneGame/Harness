apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
spec:
  address: {{ .Values.vault.address | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: {{ .Release.Namespace }}
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault
  kubernetes:
    role: platform-cicd
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitlab-runner-credentials
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: {{ .Values.secrets.gitlabRunner.path | quote }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.secrets.gitlabRunner.name | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-gitlab-repository
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: {{ .Values.secrets.argocdRepository.path | quote }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.secrets.argocdRepository.name | quote }}
    labels:
      argocd.argoproj.io/secret-type: repo-creds
