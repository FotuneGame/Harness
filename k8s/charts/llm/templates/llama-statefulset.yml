{{- $modelFile := default (printf "%s-%s.gguf" .Values.llama.model.name .Values.llama.model.quantization) .Values.llama.model.file -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: llama
  replicas: 1
  selector:
    matchLabels:
      app: llama
  template:
    metadata:
      labels:
        app: llama
    spec:
      nodeSelector:
        platform.node: llm
      {{ with .Values.llama.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{ end }}
      initContainers:
        - name: download-model
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -s "/models/{{ $modelFile }}" ]; then
                curl --fail --location --retry 5 \
                  "https://huggingface.co/{{ .Values.llama.model.repository }}/resolve/main/{{ $modelFile }}?download=true" \
                  --output "/models/{{ $modelFile }}.partial"
                mv "/models/{{ $modelFile }}.partial" "/models/{{ $modelFile }}"
              fi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama
          image: "{{ .Values.llama.image.repository }}:{{ if .Values.llama.gpu.enabled }}{{ .Values.llama.gpu.imageTag }}{{ else }}{{ .Values.llama.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.llama.image.pullPolicy }}
          args:
            - --model
            - "/models/{{ $modelFile }}"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - {{ .Values.llama.server.contextSize | quote }}
            - -ngl
            - {{ if .Values.llama.gpu.enabled }}{{ .Values.llama.gpu.layers | quote }}{{ else }}"0"{{ end }}
            - -ctk
            - {{ .Values.llama.server.cacheTypeK | quote }}
            - -ctv
            - {{ .Values.llama.server.cacheTypeV | quote }}
            - -ncmoe
            - {{ .Values.llama.server.nCpuMoe | quote }}
            - -b
            - {{ .Values.llama.server.batchSize | quote }}
            - -ub
            - {{ .Values.llama.server.ubatchSize | quote }}
            {{ if .Values.llama.server.noMap }}
            - --load-mode
            - none
            {{ end }}
            - --flash-attn
            - {{ .Values.llama.server.flashAttention | quote }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: {{ .Values.llama.resources.requests.cpu }}
              memory: {{ .Values.llama.resources.requests.memory }}
            limits:
              memory: {{ .Values.llama.resources.limits.memory }}
              {{ if .Values.llama.gpu.enabled }}
              nvidia.com/gpu: 1
              {{ end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local
        resources:
          requests:
            storage: {{ .Values.llama.storage }}
