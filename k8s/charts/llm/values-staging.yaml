llama:
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server
    pullPolicy: IfNotPresent
    pullSecrets: []
  model:
    repository: bartowski/Qwen2.5-0.5B-Instruct-GGUF
    name: Qwen2.5-0.5B-Instruct
    quantization: Q4_K_M
    file: ""
  storage: 30Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  gpu:
    enabled: false
    layers: 99
    imageTag: server-cuda
  server:
    contextSize: 2048
    noMap: false
    cacheTypeK: f16
    cacheTypeV: f16
    nCpuMoe: 0
    batchSize: 512
    ubatchSize: 128
    flashAttention: auto

# Open WebUI устанавливается как зависимость chart (Chart.yaml).
# Service open-webui:8080, StatefulSet open-webui, PVC open-webui.
open-webui:
  enabled: true
  fullnameOverride: open-webui
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: main
    pullPolicy: IfNotPresent
  service:
    port: 8080
  # Модель обслуживает llama.cpp, встроенные Ollama и Pipelines не нужны.
  ollama:
    enabled: false
  pipelines:
    enabled: false
  openaiBaseApiUrl: http://llama.llm.svc.cluster.local:8080/v1
  openaiApiKey: not-needed
  # Одна реплика: websocket работает на встроенном менеджере без Redis.
  websocket:
    enabled: true
    manager: ""
    redis:
      enabled: false
  nodeSelector:
    platform.node: llm
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: local
    size: 2Gi

perplexity:
  enabled: false
  image: ghcr.io/ggml-org/llama.cpp:full
  gpuImage: ghcr.io/ggml-org/llama.cpp:full-cuda
  input: >-
    The quick brown fox jumps over the lazy dog. Language models predict
    each token from the preceding context. This short sample can be replaced
    with a representative text corpus using the Helm values.
  contextSize: 2048
  batchSize: 512
  ubatchSize: 128
