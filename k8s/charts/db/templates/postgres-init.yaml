apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Release.Namespace }}
data:
  init.sh: |
    #!/bin/sh
    set -eu

    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set=gitlab_password="$GITLAB_DB_PASSWORD" \
      --set=keycloak_password="$KEYCLOAK_DB_PASSWORD" \
      --set=exporter_password="$POSTGRES_EXPORTER_PASSWORD" <<'SQL'
    CREATE ROLE gitlab LOGIN PASSWORD :'gitlab_password';
    CREATE ROLE keycloak LOGIN PASSWORD :'keycloak_password';
    CREATE ROLE postgres_exporter LOGIN PASSWORD :'exporter_password';
    GRANT pg_monitor TO postgres_exporter;

    CREATE DATABASE gitlabhq_production OWNER gitlab;
    CREATE DATABASE keycloak OWNER keycloak;

    \connect gitlabhq_production
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    SQL
