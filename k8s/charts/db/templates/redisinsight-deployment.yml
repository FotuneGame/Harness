apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      nodeSelector:
        platform.node: core
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          ports:
            - containerPort: 5540
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
