# Сервисы db устанавливаются как зависимости chart (Chart.yaml).
# Образы версий Bitnami перенесены из bitnami/ в bitnamilegacy/, поэтому для
# clickhouse и elasticsearch указан этот репозиторий, а
# global.security.allowInsecureImages разрешает образы вне bitnami/.
global:
  security:
    allowInsecureImages: true

# PostgreSQL: Service/StatefulSet postgresql, PVC data-postgresql-0.
postgresql:
  enabled: true
  fullnameOverride: postgresql
  auth:
    enablePostgresUser: true
    # Прикладные роли и базы создаёт скрипт primary.initdb.scripts.
    username: ""
    database: ""
    existingSecret: postgres-secret
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
  primary:
    nodeSelector:
      platform.node: core
    persistence:
      storageClass: local
      size: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    extraEnvVars:
      - name: GITLAB_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-app-credentials
            key: gitlab_password
      - name: KEYCLOAK_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-app-credentials
            key: keycloak_password
      - name: POSTGRES_EXPORTER_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-app-credentials
            key: exporter_password
    initdb:
      scripts:
        # Пароли берутся из переменных окружения, а не из values.
        init.sql: |
          \getenv gitlab_password GITLAB_DB_PASSWORD
          \getenv keycloak_password KEYCLOAK_DB_PASSWORD
          \getenv exporter_password POSTGRES_EXPORTER_PASSWORD
          CREATE ROLE gitlab LOGIN PASSWORD :'gitlab_password';
          CREATE ROLE keycloak LOGIN PASSWORD :'keycloak_password';
          CREATE ROLE postgres_exporter LOGIN PASSWORD :'exporter_password';
          GRANT pg_monitor TO postgres_exporter;
          CREATE DATABASE gitlabhq_production OWNER gitlab;
          CREATE DATABASE keycloak OWNER keycloak;
          \connect gitlabhq_production
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
  volumePermissions:
    enabled: true

# Redis: Service/StatefulSet redis-master, PVC redis-data-redis-master-0.
redis:
  enabled: true
  fullnameOverride: redis
  architecture: standalone
  auth:
    enabled: true
    existingSecret: redis-secret
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    nodeSelector:
      platform.node: core
    persistence:
      storageClass: local
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  volumePermissions:
    enabled: true

# ClickHouse: Service clickhouse (8123/9000/9363), StatefulSet
# clickhouse-shard0, PVC data-clickhouse-shard0-0.
clickhouse:
  enabled: true
  fullnameOverride: clickhouse
  image:
    repository: bitnamilegacy/clickhouse
  replicaCount: 1
  shards: 1
  # Отдельный ClickHouse Keeper для одного узла не нужен.
  keeper:
    enabled: false
  auth:
    username: default
    existingSecret: clickhouse-secret
    existingSecretKey: CLICKHOUSE_PASSWORD
  nodeSelector:
    platform.node: core
  persistence:
    storageClass: local
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  # Порт metrics (9363) в Service clickhouse для ServiceMonitor.
  metrics:
    enabled: true

# Elasticsearch: Service elasticsearch (9200), StatefulSet
# elasticsearch-master, PVC data-elasticsearch-master-0.
elasticsearch:
  enabled: true
  fullnameOverride: elasticsearch
  image:
    repository: bitnamilegacy/elasticsearch
  security:
    enabled: false
  master:
    replicaCount: 1
    heapSize: 512m
    nodeSelector:
      platform.node: core
    persistence:
      storageClass: local
      size: 10Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
  volumePermissions:
    enabled: true
  # vm.max_map_count задаёт роль minikube на узле, привилегированный
  # init-контейнер не нужен.
  sysctlImage:
    enabled: false

# pgAdmin: Deployment/Service pgadmin, PVC pgadmin.
pgadmin4:
  enabled: true
  fullnameOverride: pgadmin
  # Логин и пароль берутся из Secret, созданного Vault Secrets Operator.
  envVarsExtra:
    - name: PGADMIN_DEFAULT_EMAIL
      valueFrom:
        secretKeyRef:
          name: pgadmin-secret
          key: PGADMIN_DEFAULT_EMAIL
    - name: PGADMIN_DEFAULT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pgadmin-secret
          key: PGADMIN_DEFAULT_PASSWORD
  nodeSelector:
    platform.node: core
  persistentVolume:
    enabled: true
    storageClass: local
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
