apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clickhouse
  namespace: {{ .Values.exporterEnv.namespaces.db }}
  labels:
    release: logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/instance: db
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
