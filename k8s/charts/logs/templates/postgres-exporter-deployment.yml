apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: {{ .Values.exporterEnv.namespaces.db }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      nodeSelector:
        platform.node: core
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args:
            - --collector.stat_activity
          ports:
            - name: metrics
              containerPort: 9187
          envFrom:
            - configMapRef:
                name: postgres-exporter-config
          env:
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: exporter_password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
