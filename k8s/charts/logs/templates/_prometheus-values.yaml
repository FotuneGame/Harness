fullnameOverride: logs

crds:
  enabled: true

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.example.com:587
      smtp_from: infra-alerts@example.com
      smtp_hello: devops.local
      smtp_require_tls: true
    route:
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: email
    receivers:
      - name: email
        email_configs:
          - to: infra-alerts@example.com
            send_resolved: true
            auth_username: infra-alerts@example.com
            auth_password_file: /etc/alertmanager/secrets/smtp-credentials/password
  alertmanagerSpec:
    secrets:
      - smtp-credentials
    storage:
      volumeClaimTemplate:
        spec:
          volumeName: pv-logs-alertmanager
          storageClassName: local
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

grafana:
  enabled: true
  fullnameOverride: logs-grafana
  persistence:
    enabled: true
    type: pvc
    storageClassName: local
    volumeName: pv-logs-grafana
    lookupVolumeName: false
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  ingress:
    enabled: false
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

prometheus:
  ingress:
    enabled: false
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local
          volumeName: pv-logs-prometheus
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
