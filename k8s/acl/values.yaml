# Образы Bitnami с версиями перенесены в bitnamilegacy/; allowInsecureImages
# разрешает образы вне bitnami/. Реестр docker.io (а не registry-1.docker.io),
# чтобы образы шли через зеркало Docker Hub (terraform/variables.tf, registry_mirrors).
global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

# Service keycloak:8080, StatefulSet keycloak.
keycloak:
  fullnameOverride: keycloak
  image:
    repository: bitnamilegacy/keycloak
  service:
    ports:
      http: 8080
  # TLS завершается на ingress, Keycloak работает по HTTP.
  proxyHeaders: xforwarded
  production: false
  usePasswordFiles: false
  # Логин (auth.adminUser) — из Vault, его передаёт Ansible.
  auth:
    existingSecret: keycloak-credentials
    passwordSecretKey: password
  # База — PostgreSQL из namespace db.
  postgresql:
    enabled: false
  externalDatabase:
    host: postgresql.db.svc.cluster.local
    port: 5432
    database: keycloak
    existingSecret: keycloak-db-credentials
    existingSecretUserKey: username
    existingSecretPasswordKey: password
  nodeSelector:
    platform.node: core
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
