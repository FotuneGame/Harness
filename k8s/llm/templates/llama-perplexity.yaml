{{- if .Values.perplexity.enabled }}
{{- $model := include "llama.modelFile" . -}}
{{- $gpu := .Values.llama.gpu.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-perplexity-input
data:
  input.txt: |
    {{- .Values.perplexity.input | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-perplexity
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        platform.node: llms
      initContainers:
        - name: wait-for-model
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-ec"]
          args:
            - until [ -s "/models/{{ $model }}" ]; do sleep 5; done
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      containers:
        - name: perplexity
          image: {{ $gpu | ternary .Values.perplexity.gpuImage .Values.perplexity.image | quote }}
          args:
            - --perplexity
            - -m
            - "/models/{{ $model }}"
            - -f
            - /test/input.txt
            - -c
            - {{ .Values.perplexity.contextSize | quote }}
            - -b
            - {{ .Values.perplexity.batchSize | quote }}
            - -ub
            - {{ .Values.perplexity.ubatchSize | quote }}
          {{- if $gpu }}
          resources:
            limits:
              nvidia.com/gpu: 1
              nvidia.com/gpumem: {{ .Values.perplexity.gpuMemoryMiB }}
          {{- end }}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: test-input
              mountPath: /test
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-llama-0
        - name: test-input
          configMap:
            name: llama-perplexity-input
{{- end }}
