{{- $model := include "llama.modelFile" . -}}
{{- $gpu := .Values.llama.gpu -}}
{{- $server := .Values.llama.server -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama
spec:
  serviceName: llama
  replicas: 1
  selector:
    matchLabels:
      app: llama
  template:
    metadata:
      labels:
        app: llama
    spec:
      nodeSelector:
        platform.node: llms
      {{- with .Values.llama.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: download-model
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -s "/models/{{ $model }}" ]; then
                curl --fail --location --retry 5 \
                  "https://huggingface.co/{{ .Values.llama.model.repository }}/resolve/main/{{ $model }}?download=true" \
                  --output "/models/{{ $model }}.partial"
                mv "/models/{{ $model }}.partial" "/models/{{ $model }}"
              fi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama
          image: "{{ .Values.llama.image.repository }}:{{ $gpu.enabled | ternary $gpu.imageTag .Values.llama.image.tag }}"
          imagePullPolicy: {{ .Values.llama.image.pullPolicy }}
          args:
            - --model
            - "/models/{{ $model }}"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - {{ $server.contextSize | quote }}
            - -ngl
            - {{ $gpu.enabled | ternary $gpu.layers 0 | quote }}
            - -ctk
            - {{ $server.cacheTypeK | quote }}
            - -ctv
            - {{ $server.cacheTypeV | quote }}
            - -ncmoe
            - {{ $server.nCpuMoe | quote }}
            - -b
            - {{ $server.batchSize | quote }}
            - -ub
            - {{ $server.ubatchSize | quote }}
            {{- if $server.noMap }}
            - --load-mode
            - none
            {{- end }}
            - --flash-attn
            - {{ $server.flashAttention | quote }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              {{- toYaml .Values.llama.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.llama.resources.limits | nindent 14 }}
              {{- if $gpu.enabled }}
              nvidia.com/gpu: 1
              nvidia.com/gpumem: {{ $gpu.memoryMiB }}
              {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local
        resources:
          requests:
            storage: {{ .Values.llama.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: llama
spec:
  selector:
    app: llama
  ports:
    - name: api
      port: 8080
      targetPort: http
