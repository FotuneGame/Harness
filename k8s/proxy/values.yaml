controller:
  replicaCount: 1
  service:
    type: LoadBalancer
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    enable-real-ip: "true"
    proxy-body-size: "100m"
    limit-req-status-code: "429"
    limit-conn-status-code: "429"
  metrics:
    enabled: true
  admissionWebhooks:
    enabled: true
