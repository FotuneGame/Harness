schedule:
  namespaces: [db, mb, llm, vcs, secret, acl, logs, app]
  backup: "0 2 * * *"
  check: "0 3 * * 0"
  prune: "0 4 * * 0"
  keepLast: 7
  keepDaily: 7

# Образы Bitnami — в bitnamilegacy/ (allowInsecureImages); docker.io — через зеркало.
global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

minio:
  fullnameOverride: minio
  mode: standalone
  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client
  auth:
    existingSecret: minio-credentials
    rootUserSecretKey: username
    rootPasswordSecretKey: password
  console:
    enabled: false
  defaultInitContainers:
    volumePermissions:
      enabled: true
      image:
        repository: bitnamilegacy/os-shell
  nodeSelector:
    platform.node: core
  persistence:
    storageClass: local
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # Пользователи — Secret minio-user-* (k8s/secret) из Vault.
  provisioning:
    enabled: true
    nodeSelector:
      platform.node: core
    buckets:
      - name: backups
      - name: gitlab-artifacts
      - name: gitlab-lfs
      - name: gitlab-uploads
      - name: gitlab-packages
      - name: gitlab-pages
      - name: app
    policies:
      - name: gitlab-storage
        statements:
          - effect: Allow
            resources: ["arn:aws:s3:::gitlab-*"]
            actions: ["s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:GetBucketLocation"]
          - effect: Allow
            resources: ["arn:aws:s3:::gitlab-*/*"]
            actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
      - name: app-storage
        statements:
          - effect: Allow
            resources: ["arn:aws:s3:::app"]
            actions: ["s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:GetBucketLocation"]
          - effect: Allow
            resources: ["arn:aws:s3:::app/*"]
            actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
      - name: k8up-backups
        statements:
          - effect: Allow
            resources: ["arn:aws:s3:::backups"]
            actions: ["s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:GetBucketLocation"]
          - effect: Allow
            resources: ["arn:aws:s3:::backups/*"]
            actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
    usersExistingSecrets:
      - minio-user-gitlab
      - minio-user-k8up
      - minio-user-app

k8up:
  fullnameOverride: k8up
  nodeSelector:
    platform.node: core
  k8up:
    envVars:
      - name: BACKUP_GLOBALS3ENDPOINT
        value: http://minio.backup.svc.cluster.local:9000
      - name: BACKUP_GLOBALS3BUCKET
        value: backups
      - name: BACKUP_GLOBALACCESSKEYID
        valueFrom:
          secretKeyRef: { name: minio-k8up-credentials, key: username }
      - name: BACKUP_GLOBALSECRETACCESSKEY
        valueFrom:
          secretKeyRef: { name: minio-k8up-credentials, key: password }
      - name: BACKUP_GLOBALREPOPASSWORD
        valueFrom:
          secretKeyRef: { name: k8up-restic-credentials, key: password }
