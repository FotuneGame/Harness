# Резервные копии всех namespace с данными: K8up (restic) раз в сутки в MinIO,
# bucket volumes. Данные MinIO — volumes/backups, поэтому копия namespace лежит
# в volumes/backups/volumes/<папка>[/<env>] — так же, как его данные в volumes/.
# Пропущенную (сервер был выключен) копию создают ./cluster.sh start и up.
# Без копий: cicd и acl-<env> (данных нет, Keycloak — в PostgreSQL db-<env>),
# llm-<env> (модели скачиваются заново), backup (само хранилище копий).
# Восстановление — K8up Restore (k8s/README.md).
schedule:
  namespaces:
    - proxy
    - vcs
    - secret
    - logs
    - db-dev
    - db-stage
    - db-prod
    - mb-dev
    - mb-stage
    - mb-prod
    - app-dev
    - app-stage
    - app-prod
  backup: "0 2 * * *"
  check: "0 3 * * 0"
  prune: "0 4 * * 0"
  keepLast: 7
  keepDaily: 7

global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

minio:
  fullnameOverride: minio
  mode: standalone
  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client
  auth:
    existingSecret: minio-credentials
    rootUserSecretKey: username
    rootPasswordSecretKey: password
  # Веб-интерфейс: https://backups.local.
  console:
    image:
      repository: bitnamilegacy/minio-object-browser
    nodeSelector: { platform.node: core }
  defaultInitContainers:
    volumePermissions:
      enabled: true
      image:
        repository: bitnamilegacy/os-shell
  nodeSelector: { platform.node: core }
  persistence:
    storageClass: local
    size: 50Gi
  resources:
    requests: { cpu: 50m, memory: 192Mi }
  # Пользователь K8up — Secret minio-user-k8up (k8s/secret) из Vault.
  provisioning:
    enabled: true
    nodeSelector: { platform.node: core }
    buckets:
      - name: volumes
    policies:
      - name: k8up-backups
        statements:
          - effect: Allow
            resources: ["arn:aws:s3:::volumes"]
            actions: ["s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:GetBucketLocation"]
          - effect: Allow
            resources: ["arn:aws:s3:::volumes/*"]
            actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
    usersExistingSecrets:
      - minio-user-k8up

# Адрес MinIO, учётка и пароль restic — общие для всех Schedule.
k8up:
  fullnameOverride: k8up
  nodeSelector: { platform.node: core }
  k8up:
    envVars:
      - name: BACKUP_GLOBALS3ENDPOINT
        value: http://minio.backup.svc.cluster.local:9000
      - name: BACKUP_GLOBALS3BUCKET
        value: volumes
      - name: BACKUP_GLOBALACCESSKEYID
        valueFrom:
          secretKeyRef: { name: minio-k8up-credentials, key: username }
      - name: BACKUP_GLOBALSECRETACCESSKEY
        valueFrom:
          secretKeyRef: { name: minio-k8up-credentials, key: password }
      - name: BACKUP_GLOBALREPOPASSWORD
        valueFrom:
          secretKeyRef: { name: k8up-restic-credentials, key: password }
