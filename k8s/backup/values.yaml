# Расписание K8up (Schedule backup) в каждом namespace из списка.
schedule:
  namespaces: [db, mb, llm, vcs, secret, acl, logs, app]
  backup: "0 2 * * *"
  check: "0 3 * * 0"
  prune: "0 4 * * 0"
  keepLast: 7
  keepDaily: 7

# Образы Bitnami с версиями перенесены в bitnamilegacy/; allowInsecureImages
# разрешает образы вне bitnami/, docker.io — загрузка через зеркало Docker Hub.
global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

# Service minio:9000, Deployment minio, PVC minio (volumes/backups).
minio:
  fullnameOverride: minio
  mode: standalone
  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client
  auth:
    existingSecret: minio-credentials
    rootUserSecretKey: rootUser
    rootPasswordSecretKey: rootPassword
  console:
    enabled: false
  # Права на hostPath-том для пользователя контейнера.
  defaultInitContainers:
    volumePermissions:
      enabled: true
      image:
        repository: bitnamilegacy/os-shell
  nodeSelector:
    platform.node: core
  persistence:
    storageClass: local
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # Бакеты, политики и пользователи создаёт post-install job chart.
  # Пользователи — Secret из k8s/secret (minio-user-*), имя gitlab используется
  # в подключении GitLab, k8up — ниже.
  provisioning:
    enabled: true
    nodeSelector:
      platform.node: core
    buckets:
      - name: backups
      - name: gitlab-artifacts
      - name: gitlab-lfs
      - name: gitlab-uploads
      - name: gitlab-packages
      - name: gitlab-pages
    policies:
      - name: gitlab-storage
        statements:
          - effect: Allow
            resources: ["arn:aws:s3:::gitlab-*"]
            actions: ["s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:GetBucketLocation"]
          - effect: Allow
            resources: ["arn:aws:s3:::gitlab-*/*"]
            actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
      - name: k8up-backups
        statements:
          - effect: Allow
            resources: ["arn:aws:s3:::backups"]
            actions: ["s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:GetBucketLocation"]
          - effect: Allow
            resources: ["arn:aws:s3:::backups/*"]
            actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
    usersExistingSecrets:
      - minio-user-gitlab
      - minio-user-k8up

k8up:
  fullnameOverride: k8up
  nodeSelector:
    platform.node: core
  envVars:
    - name: BACKUP_GLOBALS3ENDPOINT
      value: http://minio.backup.svc.cluster.local:9000
    - name: BACKUP_GLOBALS3BUCKET
      value: backups
    - name: BACKUP_GLOBALACCESSKEYID
      value: k8up
    - name: BACKUP_GLOBALSECRETACCESSKEY
      valueFrom:
        secretKeyRef: { name: minio-k8up-credentials, key: secretKey }
    - name: BACKUP_GLOBALREPOPASSWORD
      valueFrom:
        secretKeyRef: { name: k8up-restic-credentials, key: password }
