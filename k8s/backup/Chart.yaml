apiVersion: v2
name: backup
description: MinIO и K8up (резервное копирование PVC)
type: application
version: 0.2.0
dependencies:
  - name: k8up
    version: 4.10.0
    repository: https://k8up-io.github.io/k8up
    condition: k8up.enabled
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
