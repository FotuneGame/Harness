apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: backup
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: backup
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: minio-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local
        resources:
          requests:
            storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: backup
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom:
            - secretRef:
                name: minio-secret
          command:
            - sh
            - -c
            - |
              until mc alias set local http://minio.backup.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 3; done
              mc mb --ignore-existing local/backups
              for bucket in gitlab-artifacts gitlab-lfs gitlab-uploads gitlab-packages gitlab-pages; do
                mc mb --ignore-existing "local/$bucket"
              done
              mc admin policy info local gitlab-storage >/dev/null 2>&1 || mc admin policy create local gitlab-storage /etc/minio/gitlab-policy.json
              mc admin user info local "$MINIO_GITLAB_ACCESS_KEY" >/dev/null 2>&1 || mc admin user add local "$MINIO_GITLAB_ACCESS_KEY" "$MINIO_GITLAB_SECRET_KEY"
              mc admin policy attach local gitlab-storage --user "$MINIO_GITLAB_ACCESS_KEY"
              mc admin policy info local k8up-backups >/dev/null 2>&1 || mc admin policy create local k8up-backups /etc/minio/k8up-policy.json
              mc admin user info local "$MINIO_K8UP_ACCESS_KEY" >/dev/null 2>&1 || mc admin user add local "$MINIO_K8UP_ACCESS_KEY" "$MINIO_K8UP_SECRET_KEY"
              mc admin policy attach local k8up-backups --user "$MINIO_K8UP_ACCESS_KEY"
          volumeMounts:
            - name: policy
              mountPath: /etc/minio
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: minio-policy
