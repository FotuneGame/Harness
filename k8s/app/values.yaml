# Поды приложений в namespace app-<env> (узел apps) получают папку
# volumes/app/<env>/<имя> в /app-data. Имя — первая метка из nameLabels,
# иначе defaultName.
appData:
  claim: app-data
  size: 20Gi
  mountPath: /app-data
  nameLabels:
    - app.kubernetes.io/instance
    - app.kubernetes.io/name
    - app
  defaultName: shared
  initImage: busybox:1.37
