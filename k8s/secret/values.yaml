# Secret, которые Vault Secrets Operator синхронизирует из Vault (KV v2, mount kv):
#   namespace -> имя Secret -> path (путь в Vault).
# Ansible по этому списку создаёт политики Vault (чтение только перечисленных
# путей) и ждёт появления Secret; optional: true — Secret не нужен для запуска.
# Значения обязательных секретов генерируются при инициализации Vault
# (ansible/roles/platform/defaults/main.yml, vault_seed).
secrets:
  db:
    postgresql-credentials: { path: db/postgresql }
    gitlab-db-credentials: { path: db/gitlab }
    keycloak-db-credentials: { path: db/keycloak }
    postgres-exporter-credentials: { path: db/postgres-exporter }
    pgadmin-credentials: { path: db/pgadmin }
    redis-credentials: { path: db/redis }
    clickhouse-credentials: { path: db/clickhouse }
  vcs:
    gitlab-db-credentials: { path: db/gitlab }
    redis-credentials: { path: db/redis }
    gitlab-root-credentials: { path: vcs/gitlab-root }
    gitlab-object-storage:
      path: backup/minio-gitlab
      # Подключение GitLab к MinIO; access key совпадает с пользователем в k8s/backup.
      template:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: gitlab
          aws_secret_access_key: {{ get .Secrets "secretKey" }}
          endpoint: http://minio.backup.svc.cluster.local:9000
          path_style: true
  acl:
    keycloak-credentials: { path: acl/keycloak }
    keycloak-db-credentials: { path: db/keycloak }
  backup:
    minio-credentials: { path: backup/minio }
    minio-k8up-credentials: { path: backup/minio-k8up }
    k8up-restic-credentials: { path: backup/restic }
    # Пользователи MinIO в формате provisioning chart Bitnami (k8s/backup).
    minio-user-gitlab:
      path: backup/minio-gitlab
      template:
        gitlab: |
          username=gitlab
          password={{ get .Secrets "secretKey" }}
          policies=gitlab-storage
          setPolicies=true
    minio-user-k8up:
      path: backup/minio-k8up
      template:
        k8up: |
          username=k8up
          password={{ get .Secrets "secretKey" }}
          policies=k8up-backups
          setPolicies=true
  logs:
    grafana-credentials: { path: logs/grafana }
    smtp-credentials: { path: logs/smtp }
    redis-credentials: { path: db/redis }
    postgres-exporter-credentials: { path: db/postgres-exporter }
  cicd:
    gitlab-runner-credentials: { path: cicd/gitlab-runner, optional: true }
    argocd-gitlab-repository:
      path: cicd/argocd-gitlab
      optional: true
      labels:
        argocd.argoproj.io/secret-type: repo-creds

vault:
  # StatefulSet/Service vault, pod vault-0, PVC data-vault-0.
  fullnameOverride: vault
  injector:
    enabled: false
  server:
    nodeSelector:
      platform.node: core
    standalone:
      enabled: true
      config: |
        ui            = true
        disable_mlock = true
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::1]:8201"
          tls_disable     = 1
        }
        storage "file" {
          path = "/vault/data"
        }
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: local
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

vault-secrets-operator:
  fullnameOverride: vault-secrets-operator
  defaultVaultConnection:
    enabled: true
    address: http://vault.secret.svc.cluster.local:8200
  controller:
    nodeSelector:
      platform.node: core
