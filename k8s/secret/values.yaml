server:
  standalone:
    enabled: true
    config: |
      ui            = true
      disable_mlock = true
      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::1]:8201"
        tls_disable     = 1
      }
      storage "file" {
        path = "/vault/data"
      }
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: local
  ui:
    enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
