# namespace -> Secret -> путь в Vault (kv). По списку Ansible создаёт политики
# чтения; optional: true — Secret не обязателен для запуска.
secrets:
  db:
    postgresql-credentials: { path: db/postgresql }
    gitlab-db-credentials: { path: db/gitlab }
    keycloak-db-credentials: { path: db/keycloak }
    postgres-exporter-credentials: { path: db/postgres-exporter }
    pgadmin-credentials: { path: db/pgadmin }
    redis-credentials: { path: db/redis }
    clickhouse-credentials: { path: db/clickhouse }
    # Учётки приложений: их создаёт Job app-accounts (k8s/db).
    app-postgresql-credentials: { path: app/postgresql }
    app-clickhouse-credentials: { path: app/clickhouse }
  vcs:
    gitlab-db-credentials: { path: db/gitlab }
    redis-credentials: { path: db/redis }
    gitlab-root-credentials: { path: vcs/gitlab-root }
    gitlab-object-storage:
      path: backup/minio-gitlab
      # Подключение GitLab к MinIO под пользователем minio-user-gitlab.
      template:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: {{ get .Secrets "username" }}
          aws_secret_access_key: {{ get .Secrets "password" }}
          endpoint: http://minio.backup.svc.cluster.local:9000
          path_style: true
  acl:
    keycloak-credentials: { path: acl/keycloak }
    keycloak-db-credentials: { path: db/keycloak }
  backup:
    minio-credentials: { path: backup/minio }
    minio-k8up-credentials: { path: backup/minio-k8up }
    k8up-restic-credentials: { path: backup/restic }
    # Пользователи MinIO в формате provisioning chart Bitnami (k8s/backup).
    minio-user-gitlab:
      path: backup/minio-gitlab
      template:
        gitlab: |
          username={{ get .Secrets "username" }}
          password={{ get .Secrets "password" }}
          policies=gitlab-storage
          setPolicies=true
    minio-user-k8up:
      path: backup/minio-k8up
      template:
        k8up: |
          username={{ get .Secrets "username" }}
          password={{ get .Secrets "password" }}
          policies=k8up-backups
          setPolicies=true
    minio-user-app:
      path: app/minio
      template:
        app: |
          username={{ get .Secrets "username" }}
          password={{ get .Secrets "password" }}
          policies=app-storage
          setPolicies=true
  logs:
    grafana-credentials: { path: logs/grafana }
    smtp-credentials: { path: logs/smtp }
    redis-credentials: { path: db/redis }
    postgres-exporter-credentials: { path: db/postgres-exporter }
  # Подключения приложений из Argo CD (пример — example/node).
  app:
    postgresql-credentials: { path: app/postgresql }
    clickhouse-credentials: { path: app/clickhouse }
    minio-credentials: { path: app/minio }
    redis-credentials: { path: db/redis }
  cicd:
    argocd-admin-credentials: { path: cicd/argocd }
    gitlab-runner-credentials: { path: cicd/gitlab-runner, optional: true }
    argocd-gitlab-repository:
      path: cicd/argocd-gitlab
      optional: true
      labels:
        argocd.argoproj.io/secret-type: repo-creds

vault:
  fullnameOverride: vault
  injector:
    enabled: false
  server:
    nodeSelector:
      platform.node: core
    standalone:
      enabled: true
      config: |
        ui            = true
        disable_mlock = true
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::1]:8201"
          tls_disable     = 1
        }
        # Root token по unseal key (vault operator generate-root): Ansible
        # применяет изменения политик к уже настроенному Vault.
        enable_unauthenticated_access = ["generate-root"]
        storage "file" {
          path = "/vault/data"
        }
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: local
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

vault-secrets-operator:
  fullnameOverride: vault-secrets-operator
  defaultVaultConnection:
    enabled: true
    address: http://vault.secret.svc.cluster.local:8200
  controller:
    nodeSelector:
      platform.node: core
