# namespace -> Secret -> путь в Vault (kv). Пути — по папкам k8s:
# <папка>/<секрет> у общих сервисов, <папка>/<env>/<секрет> у окружений.
# По списку Ansible создаёт политики чтения; optional: true — Secret не обязателен.
secrets:
  # GitLab работает на PostgreSQL и Redis окружения prod (namespace db-prod).
  vcs:
    gitlab-db-credentials: { path: db/prod/gitlab }
    redis-credentials: { path: db/prod/redis }
    gitlab-root-credentials: { path: vcs/gitlab-root }
    minio-credentials: { path: vcs/minio }
    gitlab-object-storage:
      path: vcs/minio
      template:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: {{ get .Secrets "username" }}
          aws_secret_access_key: {{ get .Secrets "password" }}
          endpoint: http://minio.vcs.svc.cluster.local:9000
          path_style: true
  backup:
    minio-credentials: { path: backup/minio }
    minio-k8up-credentials: { path: backup/minio-k8up }
    k8up-restic-credentials: { path: backup/restic }
    # Пользователь MinIO в формате provisioning chart Bitnami (k8s/backup).
    minio-user-k8up:
      path: backup/minio-k8up
      template:
        k8up: |
          username={{ get .Secrets "username" }}
          password={{ get .Secrets "password" }}
          policies=k8up-backups
          setPolicies=true
  logs:
    grafana-credentials: { path: logs/grafana }
    smtp-credentials: { path: logs/smtp }
  cicd:
    argocd-admin-credentials: { path: cicd/argocd }
    gitlab-runner-credentials: { path: cicd/gitlab-runner, optional: true }
    argocd-gitlab-repository:
      path: cicd/argocd-gitlab
      optional: true
      labels:
        argocd.argoproj.io/secret-type: repo-creds

  # Окружения dev, stage, prod.
  db-dev:
    postgresql-credentials: { path: db/dev/postgresql }
    keycloak-db-credentials: { path: db/dev/keycloak }
    redis-credentials: { path: db/dev/redis }
    clickhouse-credentials: { path: db/dev/clickhouse }
    pgadmin-credentials: { path: db/dev/pgadmin }
  acl-dev:
    keycloak-credentials: { path: acl/dev/keycloak }
    keycloak-db-credentials: { path: db/dev/keycloak }
  # Приложения: базы окружения и скачивание образов registry.local — deploy
  # token GitLab (scope read_registry) в Vault vcs/registry (username, password).
  app-dev:
    # Без пароля суперпользователя postgres.
    postgresql-credentials: &app-postgresql
      path: db/dev/postgresql
      template:
        username: '{{ get .Secrets "username" }}'
        password: '{{ get .Secrets "password" }}'
    redis-credentials: { path: db/dev/redis }
    clickhouse-credentials: { path: db/dev/clickhouse }
    gitlab-registry: &registry
      path: vcs/registry
      optional: true
      type: kubernetes.io/dockerconfigjson
      template:
        .dockerconfigjson: '{"auths":{"registry.local":{"username":"{{ get .Secrets "username" }}","password":"{{ get .Secrets "password" }}"}}}'

  db-stage:
    postgresql-credentials: { path: db/stage/postgresql }
    keycloak-db-credentials: { path: db/stage/keycloak }
    redis-credentials: { path: db/stage/redis }
    clickhouse-credentials: { path: db/stage/clickhouse }
    pgadmin-credentials: { path: db/stage/pgadmin }
  acl-stage:
    keycloak-credentials: { path: acl/stage/keycloak }
    keycloak-db-credentials: { path: db/stage/keycloak }
  app-stage:
    postgresql-credentials: { <<: *app-postgresql, path: db/stage/postgresql }
    redis-credentials: { path: db/stage/redis }
    clickhouse-credentials: { path: db/stage/clickhouse }
    gitlab-registry: *registry

  db-prod:
    postgresql-credentials: { path: db/prod/postgresql }
    keycloak-db-credentials: { path: db/prod/keycloak }
    redis-credentials: { path: db/prod/redis }
    clickhouse-credentials: { path: db/prod/clickhouse }
    pgadmin-credentials: { path: db/prod/pgadmin }
    gitlab-db-credentials: { path: db/prod/gitlab }
  acl-prod:
    keycloak-credentials: { path: acl/prod/keycloak }
    keycloak-db-credentials: { path: db/prod/keycloak }
  app-prod:
    postgresql-credentials: { <<: *app-postgresql, path: db/prod/postgresql }
    redis-credentials: { path: db/prod/redis }
    clickhouse-credentials: { path: db/prod/clickhouse }
    gitlab-registry: *registry

vault:
  fullnameOverride: vault
  injector:
    enabled: false
  server:
    nodeSelector:
      platform.node: core
    standalone:
      enabled: true
      config: |
        ui            = true
        disable_mlock = true
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::1]:8201"
          tls_disable     = 1
        }
        # Root token по unseal key (vault operator generate-root): Ansible
        # применяет изменения политик к уже настроенному Vault.
        enable_unauthenticated_access = ["generate-root"]
        storage "file" {
          path = "/vault/data"
        }
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: local
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

vault-secrets-operator:
  fullnameOverride: vault-secrets-operator
  defaultVaultConnection:
    enabled: true
    address: http://vault.secret.svc.cluster.local:8200
  controller:
    nodeSelector:
      platform.node: core
