apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: db
spec:
  address: http://vault.secret.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: db
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault
  kubernetes:
    role: platform-db
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgres-credentials
  namespace: db
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: db/postgres
  refreshAfter: 60s
  destination:
    create: true
    name: postgres-secret
---
apiVersion: secrets.hashicorp.com/v1beta1
