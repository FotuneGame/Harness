apiVersion: v2
name: secret
description: Vault, Vault Secrets Operator и синхронизация секретов в namespace
type: application
version: 0.2.0
# Репозиторий helm.releases.hashicorp.com недоступен, поэтому архивы charts
# лежат в charts/ и хранятся в Git.
dependencies:
  - name: vault
    version: 0.34.1
    repository: https://helm.releases.hashicorp.com
    condition: vault.enabled
  - name: vault-secrets-operator
    version: 1.6.0
    repository: https://helm.releases.hashicorp.com
    condition: vault-secrets-operator.enabled
