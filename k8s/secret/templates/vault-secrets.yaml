{{- range $namespace, $secrets := .Values.secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: {{ $namespace }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: platform-{{ $namespace }}
    serviceAccount: default
{{- range $name, $secret := $secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: {{ $secret.path }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ $name }}
    {{- with $secret.labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $secret.template }}
    # В Secret только ключи из template, без исходных ключей Vault.
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        {{- range $key, $text := . }}
        {{ $key }}:
          text: {{ $text | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
