# Образы Bitnami — в bitnamilegacy/ (allowInsecureImages); docker.io — через зеркало.
global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true

# KRaft: один узел совмещает роли controller и broker.
kafka:
  fullnameOverride: kafka
  image:
    repository: bitnamilegacy/kafka
  clusterId: MkU3OEVBNTcwNTJENDM2Qk
  # Без TLS и SASL: Kafka доступна только внутри кластера.
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  # Один брокер: внутренние топики не могут иметь репликацию > 1.
  overrideConfiguration:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    group.initial.rebalance.delay.ms: 0
  controller:
    replicaCount: 1
    nodeSelector:
      platform.node: core
    persistence:
      storageClass: local
      size: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
  broker:
    replicaCount: 0

kafka-ui:
  fullnameOverride: kafka-ui
  envs:
    config:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka.mb.svc.cluster.local:9092
  nodeSelector:
    platform.node: core
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
