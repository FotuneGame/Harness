apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pgadmin
  namespace: db
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pgadmin
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
