apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-registry-0
  namespace: vcs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: vcs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: REGISTRY_AUTH_TOKEN_REALM
              value: http://${gitlab_host}/jwt/auth
            - name: REGISTRY_AUTH_TOKEN_SERVICE
              value: container_registry
            - name: REGISTRY_AUTH_TOKEN_ISSUER
              value: gitlab-issuer
            - name: REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE
              value: /etc/docker/registry/certificate.crt
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitlab-registry-httpsecret
                  key: secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: registry-auth
              mountPath: /etc/docker/registry/certificate.crt
              subPath: registry-auth.crt
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-registry-0
        - name: registry-auth
          secret:
            secretName: gitlab-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: vcs
spec:
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
