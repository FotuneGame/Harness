# Container Registry с данными в volumes/vcs/registry (templates/registry.yaml);
# токены выдаёт GitLab.
registry:
  image: registry:2
  storage: 10Gi
  env:
    REGISTRY_HTTP_ADDR: ":5000"
    REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    REGISTRY_STORAGE_DELETE_ENABLED: "true"
    REGISTRY_AUTH_TOKEN_REALM: https://gitlab.local/jwt/auth
    REGISTRY_AUTH_TOKEN_SERVICE: container_registry
    REGISTRY_AUTH_TOKEN_ISSUER: gitlab-issuer
    REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /etc/docker/registry/certificate.crt

# Объекты GitLab (artifacts, lfs, uploads, packages, pages) в volumes/vcs/minio;
# вход GitLab — учётка Vault vcs/minio.
minio:
  fullnameOverride: minio
  mode: standalone
  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client
  auth:
    existingSecret: minio-credentials
    rootUserSecretKey: username
    rootPasswordSecretKey: password
  defaultBuckets: gitlab-artifacts,gitlab-lfs,gitlab-uploads,gitlab-packages,gitlab-pages
  console:
    enabled: false
  defaultInitContainers:
    volumePermissions:
      enabled: true
      image:
        repository: bitnamilegacy/os-shell
  nodeSelector: { platform.node: core }
  persistence:
    storageClass: local
    size: 10Gi
  resources:
    requests: { cpu: 50m, memory: 192Mi }

# Вход через NGINX Ingress (k8s/proxy): Gateway API и Envoy Gateway из chart
# GitLab не нужны. Условие вложенного chart читается только из global верхнего уровня.
# Образы Bitnami (MinIO) — в bitnamilegacy/ (allowInsecureImages).
global:
  imageRegistry: docker.io
  security:
    allowInsecureImages: true
  gatewayApi:
    enabled: false
    installEnvoy: false

gitlab:
  global:
    edition: ce
    nodeSelector:
      platform.node: core
    hosts:
      domain: local
      https: true
      registry:
        name: registry.local
    initialRootPassword:
      secret: gitlab-root-credentials
      key: password
    ingress:
      enabled: true
      class: nginx
      provider: nginx
      configureCertmanager: false
      annotations:
        nginx.ingress.kubernetes.io/limit-rps: "100"
        nginx.ingress.kubernetes.io/limit-burst-multiplier: "10"
        nginx.ingress.kubernetes.io/limit-connections: "300"
        nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      tls:
        enabled: true
        secretName: local-wildcard-tls
    # Объекты хранятся в MinIO этого chart; встроенный MinIO GitLab не нужен.
    minio:
      enabled: false
    appConfig:
      object_store:
        enabled: true
        connection:
          secret: gitlab-object-storage
          key: connection
      artifacts:
        bucket: gitlab-artifacts
      lfs:
        bucket: gitlab-lfs
      uploads:
        bucket: gitlab-uploads
      packages:
        bucket: gitlab-packages
    # PostgreSQL и Redis окружения prod: роль и база gitlabhq_production создаются
    # в k8s/db (values-prod.yaml), в Redis — отдельная база 1 (0 — приложения prod).
    psql:
      host: postgresql.db-prod.svc.cluster.local
      port: 5432
      # Логин (username) — из Vault, его передаёт Ansible.
      database: gitlabhq_production
      password:
        secret: gitlab-db-credentials
        key: password
    redis:
      host: redis-master.db-prod.svc.cluster.local
      port: 6379
      database: 1
      auth:
        enabled: true
        secret: redis-credentials
        key: password
    registry:
      enabled: true
      host: registry.local
      # Адрес целиком: serviceName chart дополнил бы префиксом gitlab-.
      api:
        protocol: http
        host: registry.vcs.svc.cluster.local
        port: 5000
  # Ingress-контроллер, cert-manager, PostgreSQL, Redis, Registry и Runner
  # разворачиваются отдельно.
  nginx-ingress:
    enabled: false
  installCertmanager: false
  certmanager-issuer:
    email: infra-alerts@example.com
  prometheus:
    install: false
  gitlab-runner:
    install: false
  registry:
    enabled: false
    tokenIssuer: gitlab-issuer
  gitlab:
    webservice:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
    sidekiq:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
    gitaly:
      persistence:
        size: 10Gi
        storageClass: local
        matchLabels:
          volume: gitaly
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    gitlab-shell:
      minReplicas: 1
