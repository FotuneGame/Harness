global:
  edition: ce
  hosts:
    domain: local
    registry:
      name: registry.local
    https: false
  registry:
    host: registry.local
    enabled: true
    api:
      protocol: http
      serviceName: registry
      port: 5000
  ingress:
    enabled: true
    class: nginx
    provider: nginx
    configureCertmanager: false
    annotations:
      nginx.ingress.kubernetes.io/limit-rps: "20"
      nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
      nginx.ingress.kubernetes.io/limit-connections: "30"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    tls:
      enabled: false
  appConfig:
    object_store:
      enabled: true
      connection:
        secret: gitlab-object-storage
        key: connection
    lfs:
      enabled: true
    artifacts:
      enabled: true
    uploads:
      enabled: true
    packages:
      enabled: true
  psql:
    host: postgresql.db.svc.cluster.local
    port: 5432
    username: gitlab
    database: gitlabhq_production
    password:
      secret: gitlab-postgresql-password
      key: postgresql-password
  redis:
    host: redis.db.svc.cluster.local
    port: 6379
    auth:
      enabled: true
      secret: redis-secret
      key: REDIS_PASSWORD

nginx-ingress:
  enabled: false
installCertmanager: false
certmanager-issuer:
  email: infra-alerts@example.com
prometheus:
  install: false
gitlab-runner:
  install: false
postgresql:
  install: false
redis:
  install: false
registry:
  enabled: false
  tokenIssuer: gitlab-issuer

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
  gitaly:
    persistence:
      size: 10Gi
      storageClass: local
      matchLabels:
        volume: gitaly
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

gitlab-shell:
  minReplicas: 1
