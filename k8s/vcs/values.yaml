global:
  edition: ce
  hosts:
    https: false
  ingress:
    enabled: true
    class: nginx
    provider: nginx
    configureCertmanager: false
    tls:
      enabled: false
  registry:
    enabled: true
    api:
      protocol: http
      serviceName: registry
      port: 5000
  psql:
    host: postgresql.db.svc.cluster.local
    port: 5432
    username: gitlab
    database: gitlabhq_production
    password:
      secret: gitlab-postgresql-password
      key: postgresql-password
  redis:
    host: redis.db.svc.cluster.local
    port: 6379
    auth:
      enabled: false

nginx-ingress:
  enabled: false
certmanager:
  install: false
prometheus:
  install: false
gitlab-runner:
  install: false
postgresql:
  install: false
redis:
  install: false
registry:
  enabled: false
  tokenIssuer: gitlab-issuer

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
  gitaly:
    persistence:
      size: 10Gi
      storageClass: local
      matchLabels:
        volume: gitaly
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

gitlab-shell:
  minReplicas: 1

minio:
  persistence:
    size: 5Gi
    storageClass: local
    volumeName: pv-vcs-minio
