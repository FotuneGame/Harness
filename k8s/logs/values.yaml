# Метрики баз (PostgreSQL, Redis, ClickHouse) — встроенные экспортеры charts
# Bitnami в k8s/db (metrics.enabled), Prometheus находит их по ServiceMonitor.
# Дашборды Grafana: стандартные kube-prometheus-stack (кластер, узлы, namespace,
# поды) и templates/dashboards/ (ConfigMap с меткой grafana_dashboard).
kube-prometheus-stack:
  fullnameOverride: logs
  crds:
    enabled: true

  # etcd, kube-scheduler и kube-controller-manager в minikube отдают метрики
  # только на 127.0.0.1: их цели всегда недоступны (ложные TargetDown).
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      windows: false

  alertmanager:
    config:
      global:
        resolve_timeout: 5m
        smtp_smarthost: smtp.example.com:587
        smtp_from: infra-alerts@example.com
        smtp_hello: devops.local
        smtp_require_tls: true
        # Логин (smtp_auth_username) — из Vault, его передаёт Ansible.
      route:
        group_by: [alertname, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: email
      receivers:
        # Служебный алерт Watchdog по умолчанию направляется в receiver "null".
        - name: "null"
        - name: email
          email_configs:
            - to: infra-alerts@example.com
              send_resolved: true
              auth_password_file: /etc/alertmanager/secrets/smtp-credentials/password
    alertmanagerSpec:
      nodeSelector:
        platform.node: core
      secrets:
        - smtp-credentials
      storage:
        volumeClaimTemplate:
          spec:
            volumeName: pv-logs-alertmanager
            storageClassName: local
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
      resources:
        requests:
          cpu: 50m
          memory: 64Mi

  grafana:
    fullnameOverride: logs-grafana
    admin:
      existingSecret: grafana-credentials
      userKey: username
      passwordKey: password
    nodeSelector:
      platform.node: core
    persistence:
      enabled: true
      type: pvc
      storageClassName: local
      volumeName: pv-logs-grafana
      lookupVolumeName: false
      accessModes: [ReadWriteOnce]
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard

  prometheus:
    prometheusSpec:
      nodeSelector:
        platform.node: core
      retention: 7d
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorNamespaceSelector: {}
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            volumeName: pv-logs-prometheus
            storageClassName: local
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi

  prometheusOperator:
    nodeSelector:
      platform.node: core
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

  # DaemonSet на всех узлах, включая узел apps с taint.
  # cAdvisor kubelet в minikube с Docker (cri-dockerd) видит только cgroup подов:
  # CPU и память узлов, подов и память контейнеров — из /metrics/resource.
  kubelet:
    serviceMonitor:
      resource: true
      resourcePath: /metrics/resource

  # Дашборды node-exporter только для Linux.
  nodeExporter:
    operatingSystems:
      aix:
        enabled: false
      darwin:
        enabled: false

  prometheus-node-exporter:
    fullnameOverride: logs-prometheus-node-exporter
    tolerations:
      - operator: Exists
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

  kube-state-metrics:
    fullnameOverride: logs-kube-state-metrics
    nodeSelector:
      platform.node: core
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

  additionalPrometheusRulesMap:
    platform-health:
      groups:
        - name: kubernetes-health
          rules:
            - alert: KubernetesNodeNotReady
              expr: kube_node_status_condition{condition="Ready",status="true"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: Kubernetes node is not ready
                description: Node {{ $labels.node }} has not been Ready for five minutes.
            - alert: KubernetesPodCrashLooping
              expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: Pod is crash looping
                description: "{{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff."
            - alert: PersistentVolumeUsageHigh
              expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Persistent volume is over 85% full
                description: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is nearing capacity.
        - name: platform-services
          rules:
            - alert: PlatformExporterDown
              expr: up{service=~"postgresql-metrics|redis-metrics|clickhouse"} == 0
              for: 3m
              labels:
                severity: critical
              annotations:
                summary: A database metrics endpoint is unavailable
                description: Prometheus cannot scrape {{ $labels.namespace }}/{{ $labels.service }}.
            - alert: PostgreSQLConnectionsHigh
              expr: sum by (namespace) (pg_stat_activity_count) / max by (namespace) (pg_settings_max_connections) > 0.8
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: PostgreSQL connection usage is high
                description: PostgreSQL in {{ $labels.namespace }} is using more than 80% of configured connections.
            # Без maxmemory (0) деление дало бы +Inf и ложную тревогу.
            - alert: RedisMemoryUsageHigh
              expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0) > 0.85
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Redis memory usage is high
                description: Redis in {{ $labels.namespace }} is using more than 85% of its configured memory limit.

# Трейсы принимаются по OTLP (4317 gRPC, 4318 HTTP) и хранятся в памяти.
jaeger:
  fullnameOverride: jaeger
  nodeSelector:
    platform.node: core
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    extraPorts:
      - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
      - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }
  userconfig:
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [jaeger_storage_exporter]
    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
      jaeger_query:
        storage:
          traces: local
      jaeger_storage:
        backends:
          local:
            memory:
              max_traces: 50000
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      jaeger_storage_exporter:
        trace_storage: local
