{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
# Grafana sidecar подключает ConfigMap с меткой grafana_dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
