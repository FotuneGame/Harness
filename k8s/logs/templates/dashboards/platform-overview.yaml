          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (rate(node_network_receive_bytes_total{device=~\"cali.+\"}[5m]) * on (device) group_left (namespace) max by (device, namespace) (platform_pod_interface))"
            },
            {
              "refId": "B",
