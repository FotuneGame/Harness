# Подписи рядов — displayName ${__field.labels.<метка>}: двойные фигурные скобки
# legendFormat разобрал бы Helm.
{{- $cpus := 0 }}
{{- $ram := 0 }}
{{- range .Values.platformExporter.nodes }}
{{- $cpus = add $cpus .cpus }}
{{- $ram = add $ram .memory_gib }}
{{- end }}
{{- if not $cpus }}{{ $cpus = "N" }}{{ $ram = "N" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-platform-overview
  labels:
    grafana_dashboard: "1"
data:
  platform-overview.json: |
    {
      "title": "Platform overview",
      "uid": "platform-overview",
      "schemaVersion": 39,
      "version": 21,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Кластер",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "CPU узлов, % ({{ $cpus }} потоков)",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "displayName": "${__field.labels.node} (лимит ${__field.labels.limit})",
              "unit": "percent",
              "max": 100
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (node) (rate(node_cpu_usage_seconds_total[5m]) * on (instance) group_left (node) max by (instance, node) (kubelet_node_name)) / scalar(sum(max by (node) (platform_node_cpu_limit))) * on (node) group_left (limit) (max by (node, limit) (platform_node_cpu_limit{limit!=\"\"}) * 0 + 1)"
            },
            {
              "refId": "B",
              "expr": "100 * sum(rate(node_cpu_usage_seconds_total[5m])) / scalar(sum(max by (node) (platform_node_cpu_limit)))"
            }
          ],
          "description": "100% — все {{ $cpus }} потоков узлов (сумма CPU из nodes в terraform/variables.tf)."
        },
        {
          "id": 3,
          "title": "Память узлов ({{ $ram }} GiB RAM)",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "unit": "bytes"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "${__field.labels.node} (лимит ${__field.labels.limit}) используется"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "${__field.labels.node} (лимит ${__field.labels.limit}) запрошено подами"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "C"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего используется"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "D"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего запрошено подами"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dot"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (node) (node_memory_working_set_bytes * on (instance) group_left (node) max by (instance, node) (kubelet_node_name)) * on (node) group_left (limit) (max by (node, limit) (platform_node_memory_limit_bytes{limit!=\"\"}) * 0 + 1)"
            },
            {
              "refId": "B",
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"}) * on (node) group_left (limit) (max by (node, limit) (platform_node_memory_limit_bytes{limit!=\"\"}) * 0 + 1)"
            },
            {
              "refId": "C",
              "expr": "sum(sum by (node) (node_memory_working_set_bytes * on (instance) group_left (node) max by (instance, node) (kubelet_node_name)))"
            },
            {
              "refId": "D",
              "expr": "sum(sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"}))"
            }
          ],
          "description": "Память узлов и запрошенная подами; {{ $ram }} GiB — сумма памяти узлов из nodes в terraform/variables.tf."
        },
        {
          "id": 4,
          "title": "Неготовые поды по namespace",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "noValue": "0",
              "displayName": "${__field.labels.namespace}",
              "decimals": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (max by (namespace, pod) (kube_pod_status_ready{condition=\"false\"}) * on (namespace, pod) (max by (namespace, pod) (kube_pod_status_phase{phase=~\"Running|Pending\"}) == 1))"
            }
          ]
        },
        {
          "id": 5,
          "title": "Диск volumes/",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "unit": "bytes"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "занято"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "свободно"
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(node_filesystem_size_bytes{mountpoint=\"/volumes\"} - node_filesystem_avail_bytes{mountpoint=\"/volumes\"})"
            },
            {
              "refId": "B",
              "expr": "max(node_filesystem_avail_bytes{mountpoint=\"/volumes\"})"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Нагрузка по namespace",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          }
        },
        {
          "id": 7,
          "title": "CPU, % от сервера",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "displayName": "${__field.labels.namespace}",
              "unit": "percent"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (namespace) (rate(pod_cpu_usage_seconds_total[5m])) / scalar(max(kube_node_status_capacity{resource=\"cpu\"}))"
            },
            {
              "refId": "B",
              "expr": "100 * sum(rate(pod_cpu_usage_seconds_total[5m])) / scalar(max(kube_node_status_capacity{resource=\"cpu\"}))"
            }
          ],
          "description": "Доля всех потоков CPU сервера (WSL), как CPU usage в Docker Desktop.",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 8,
          "title": "RAM",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "displayName": "${__field.labels.namespace}",
              "unit": "bytes"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (pod_memory_working_set_bytes)"
            },
            {
              "refId": "B",
              "expr": "sum(pod_memory_working_set_bytes)"
            }
          ],
          "description": "Память подов (working set). Всего меньше, чем в Docker Desktop: туда входят ещё kubelet, Docker и система узлов.",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 9,
          "title": "SSD/HDD: занято в volumes/",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "displayName": "${__field.labels.namespace}",
              "unit": "bytes"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (platform_volume_used_bytes)"
            },
            {
              "refId": "B",
              "expr": "sum(platform_volume_used_bytes)"
            }
          ],
          "description": "Размер каталогов volumes/ namespace, обновляется раз в 5 минут.",
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 10,
          "title": "SSD/HDD: запись",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "displayName": "${__field.labels.namespace}",
              "unit": "Bps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (rate(container_fs_writes_bytes_total[5m]))"
            },
            {
              "refId": "B",
              "expr": "sum(rate(container_fs_writes_bytes_total[5m]))"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 11,
          "title": "SSD/HDD: чтение",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "displayName": "${__field.labels.namespace}",
              "unit": "Bps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (rate(container_fs_reads_bytes_total[5m]))"
            },
            {
              "refId": "B",
              "expr": "sum(rate(container_fs_reads_bytes_total[5m]))"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 12,
          "title": "Сеть: получено подами",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 30
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "displayName": "${__field.labels.namespace}",
              "unit": "Bps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (rate(node_network_transmit_bytes_total{device=~\"cali.+\"}[5m]) * on (device) group_left (namespace) max by (device, namespace) (platform_pod_interface))"
            },
            {
              "refId": "B",
              "expr": "sum(rate(node_network_transmit_bytes_total{device=~\"cali.+\"}[5m]))"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 13,
          "title": "Сеть: отправлено подами",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 30
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "displayName": "${__field.labels.namespace}",
              "unit": "Bps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Всего"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
