---
host_repo: "{{ playbook_dir | dirname }}"
host_is_wsl: "{{ 'microsoft' in ansible_facts.kernel | lower }}"

host_packages:
  - ca-certificates
  - conntrack
  - curl
  - gnupg
  - jq
  - libcap2-bin
  - openssl
  - socat
  - tar
  - unzip

host_binaries:
  - url: https://storage.googleapis.com/minikube/releases/v1.34.0/minikube-linux-amd64
    checksum: sha256:https://storage.googleapis.com/minikube/releases/v1.34.0/minikube-linux-amd64.sha256
    dest: /usr/local/bin/minikube
  - url: "https://dl.k8s.io/release/{{ host_tf.kubernetes_version }}/bin/linux/amd64/kubectl"
    checksum: "sha256:https://dl.k8s.io/release/{{ host_tf.kubernetes_version }}/bin/linux/amd64/kubectl.sha256"
    dest: /usr/local/bin/kubectl
host_archives:
  - url: https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
    checksum: sha256:https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
    binary: linux-amd64/helm
  - url: https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
    checksum: sha256:https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_SHA256SUMS
    binary: terraform
host_archives_dir: /opt/platform-tools

host_encryption_config: "{{ host_repo }}/volumes/minikube/encryption/encryption-config.yaml"
host_encryption_node_path: "{{ host_tf.encryption_config }}"

host_tls_dir: "{{ host_repo }}/volumes/proxy/tls"

host_proxy_values: "{{ lookup('file', host_repo + '/k8s/proxy/values.yaml') | from_yaml }}"
host_hostnames: "{{ (host_proxy_values.routes | map(attribute='host') | list + host_proxy_values.extraHosts) | unique }}"
host_foundation_values: "{{ lookup('file', host_repo + '/k8s/foundation/values.yaml') | from_yaml }}"
host_volume_paths: >-
  {%- set values = host_foundation_values -%}
  {%- set paths = values.volumes | rejectattr('hostFiles', 'defined') | map(attribute='path') | list -%}
  {%- for env in values.environments.names -%}
  {%- for folder, settings in values.environments.folders.items() -%}
  {%- for volume in settings.volumes | default([]) -%}
  {%- set _ = paths.append([folder, env, volume.path | default('')] | select | join('/')) -%}
  {%- endfor -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ paths }}
