---
- name: Определение WSL
  ansible.builtin.set_fact:
    ingress_is_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | lower) }}"

- name: Проверка команды powershell.exe
  ansible.builtin.shell: command -v powershell.exe
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  register: ingress_powershell
  when: ingress_is_wsl | bool

- name: Определение пути к скрипту Windows hosts
  ansible.builtin.command:
    argv:
      - wslpath
      - -w
      - "{{ role_path }}/files/update-windows-hosts.ps1"
  changed_when: false
  register: ingress_windows_script
  when:
    - ingress_is_wsl | bool
    - (ingress_powershell.rc | default(1)) == 0

- name: Обновление Windows hosts
  ansible.builtin.command:
    argv:
      - powershell.exe
      - -NoProfile
      - -ExecutionPolicy
      - Bypass
      - -File
      - "{{ ingress_windows_script.stdout | trim }}"
      - -Names
      - "{{ ingress_hostnames | join(',') }}"
  register: ingress_windows_hosts
  changed_when: false
  when:
    - ingress_is_wsl | bool
    - (ingress_powershell.rc | default(1)) == 0

- name: Вывод результата обновления Windows hosts
  ansible.builtin.debug:
    msg: "{{ ingress_windows_hosts.stdout | default('') | trim }}"
  when:
    - ingress_is_wsl | bool
    - (ingress_powershell.rc | default(1)) == 0
    - ingress_windows_hosts.stdout | default('') | length > 0

- name: Обновление /etc/hosts
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/update-linux-hosts.py {{ ingress_hostnames | join(' ') }}"
  become: true
  register: ingress_linux_hosts
  when: not (ingress_is_wsl | bool) or (ingress_powershell.rc | default(1)) != 0

- name: Вывод результата обновления /etc/hosts
  ansible.builtin.debug:
    msg: "{{ ingress_linux_hosts.stdout | default('') | trim }}"
  when:
    - ingress_linux_hosts is defined
    - ingress_linux_hosts.stdout | default('') | length > 0
