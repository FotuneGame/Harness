---
- name: Проверка PID-файла
  ansible.builtin.stat:
    path: "{{ ingress_state_dir }}/ingress-forward.pid"
  register: ingress_pid_file

- name: Проброс не запущен
  ansible.builtin.debug:
    msg: "Проброс ingress не запущен."
  when: not ingress_pid_file.stat.exists

- name: Чтение PID проброса
  ansible.builtin.slurp:
    src: "{{ ingress_state_dir }}/ingress-forward.pid"
  register: ingress_pid_raw
  when: ingress_pid_file.stat.exists

- name: Проверка PID
  ansible.builtin.assert:
    that:
      - (ingress_pid_raw.content | b64decode | trim) is match('^[0-9]+$')
    fail_msg: "Некорректный PID-файл: {{ ingress_state_dir }}/ingress-forward.pid"
  when: ingress_pid_file.stat.exists

- name: Определение PID проброса
  ansible.builtin.set_fact:
    ingress_forward_pid: "{{ ingress_pid_raw.content | b64decode | trim }}"
  when: ingress_pid_file.stat.exists

- name: Проверка процесса проброса
  ansible.builtin.command: ps -p {{ ingress_forward_pid }} -o args=
  changed_when: false
  failed_when: false
  register: ingress_process
  when: ingress_pid_file.stat.exists

- name: Остановка процесса проброса
  ansible.builtin.command: kill {{ ingress_forward_pid }}
  when:
    - ingress_pid_file.stat.exists
    - (ingress_process.rc | default(1)) == 0
    - "'kubectl port-forward' in (ingress_process.stdout | default(''))"
    - "'service/{{ ingress_service }}' in (ingress_process.stdout | default(''))"

- name: Ожидание остановки процесса
  ansible.builtin.command: ps -p {{ ingress_forward_pid }} -o args=
  register: ingress_process_after
  until: ingress_process_after.rc != 0
  retries: 10
  delay: 1
  changed_when: false
  failed_when: false
  when:
    - ingress_pid_file.stat.exists
    - (ingress_process.rc | default(1)) == 0
    - "'kubectl port-forward' in (ingress_process.stdout | default(''))"

- name: Удаление PID-файла
  ansible.builtin.file:
    path: "{{ ingress_state_dir }}/ingress-forward.pid"
    state: absent
  when: ingress_pid_file.stat.exists

- name: Проброс остановлен
  ansible.builtin.debug:
    msg: "Проброс ingress остановлен."
  when: ingress_pid_file.stat.exists
