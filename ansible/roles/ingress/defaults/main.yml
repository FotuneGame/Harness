---
ingress_namespace: proxy
ingress_service: ingress-nginx-controller
ingress_listen_address: 127.0.0.1
ingress_http_port: 80
ingress_https_port: 443
ingress_hostnames:
  - gitlab.local
  - registry.local
  - pg.local
  - redis.local
  - clickhouse.local
  - kafka.local
  - llama.local
  - keycloak.local
  - vault.local
  - grafana.local
  - prometheus.local
  - alert.local
  - jaeger.local
  - argocd.local
ingress_state_dir: "{{ (ansible_env.XDG_RUNTIME_DIR | default(ansible_env.HOME ~ '/.local/state')) ~ '/devops-cluster' }}"
