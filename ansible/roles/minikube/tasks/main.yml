---
- name: Проверка обязательных команд
  ansible.builtin.shell: command -v {{ item }}
  args:
    executable: /bin/bash
  loop:
    - docker
    - minikube
    - kubectl
    - terraform
    - jq
  changed_when: false
  failed_when: false
  register: minikube_required_commands

- name: Проверка наличия обязательных команд
  ansible.builtin.assert:
    that:
      - minikube_required_commands.results | selectattr('rc', 'ne', 0) | list | length == 0
    fail_msg: >-
      Не найдены обязательные команды:
      {{ minikube_required_commands.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}.
      Сначала выполните bash scripts/prepare-host.sh.

- name: Проверка доступности Docker
  ansible.builtin.command: docker info
  changed_when: false
  failed_when: false
  register: minikube_docker_info

- name: Проверка результата Docker
  ansible.builtin.assert:
    that:
      - minikube_docker_info.rc == 0
    fail_msg: "Docker недоступен. Запустите Docker Desktop или службу Docker."

- name: Определение WSL
  ansible.builtin.set_fact:
    minikube_is_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | lower) }}"

- name: Проверка опций монтирования в WSL
  ansible.builtin.command:
    argv:
      - findmnt
      - --target
      - "{{ repo_root }}"
      - --noheadings
      - --output
      - OPTIONS
  changed_when: false
  failed_when: false
  register: minikube_mount_options
  when: minikube_is_wsl | bool

- name: Проверка поддержки metadata в WSL
  ansible.builtin.assert:
    that:
      - >-
        (minikube_mount_options.stdout | default('')
         | regex_search('(^|[;,])\s*metadata\s*([;,]|$)')
         | default('', true)) | length > 0
    fail_msg: >-
      Диск с репозиторием смонтирован в WSL без поддержки metadata.
      Добавьте "metadata" в [automount] options в /etc/wsl.conf, выполните
      wsl.exe --shutdown в Windows и запустите WSL заново.
  when: minikube_is_wsl | bool

- name: Проверка NVIDIA GPU командой nvidia-smi
  ansible.builtin.command: nvidia-smi
  changed_when: false
  failed_when: false
  register: minikube_nvidia_smi

- name: Проверка доступа Docker к NVIDIA GPU
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --gpus
      - all
      - nvidia/cuda:12.6.3-base-ubuntu22.04
      - nvidia-smi
      - -L
  changed_when: false
  failed_when: false
  register: minikube_docker_gpu
  when: minikube_nvidia_smi.rc == 0

- name: Определение доступности GPU
  ansible.builtin.set_fact:
    minikube_gpu_available: "{{ (minikube_nvidia_smi.rc == 0) and ((minikube_docker_gpu.rc | default(1)) == 0) }}"

- name: Проверка доступности GPU
  ansible.builtin.assert:
    that:
      - (minikube_gpu_available | bool) or (minikube_is_wsl | bool)
    fail_msg: >-
      Docker не может использовать NVIDIA GPU. Проверьте NVIDIA Container Toolkit:
      sudo nvidia-ctk runtime configure --runtime=docker,
      sudo systemctl restart docker.

- name: Предупреждение об отсутствии GPU в WSL
  ansible.builtin.debug:
    msg: "Предупреждение: NVIDIA GPU недоступен в WSL2; Minikube продолжит работу без GPU."
  when:
    - minikube_is_wsl | bool
    - not (minikube_gpu_available | bool)

- name: Проверка значения bpf_jit_harden
  ansible.builtin.slurp:
    src: /proc/sys/net/core/bpf_jit_harden
  register: minikube_bpf_jit_harden
  failed_when: false
  when: not (minikube_is_wsl | bool)

- name: Проверка требования bpf_jit_harden
  ansible.builtin.assert:
    that:
      - (minikube_bpf_jit_harden.content | default('') | b64decode | trim) in ['', '0']
    fail_msg: >-
      Minikube GPU требует net.core.bpf_jit_harden=0. Выполните
      sudo sysctl -w net.core.bpf_jit_harden=0 и повторите запуск.
  when: not (minikube_is_wsl | bool)

- name: Чтение профиля узлов Terraform
  ansible.builtin.command:
    argv:
      - terraform
      - -chdir=terraform
      - output
      - -json
      - node_profiles
  args:
    chdir: "{{ repo_root }}"
  changed_when: false
  register: minikube_node_profiles_raw

- name: Разбор профиля узлов Terraform
  ansible.builtin.set_fact:
    minikube_node_profiles: "{{ minikube_node_profiles_raw.stdout | from_json }}"

- name: Проверка структуры профиля узлов
  ansible.builtin.assert:
    that:
      - minikube_node_profiles.keys() | list | sort == ['applications', 'llm', 'platform']
      - (minikube_node_profiles.platform.cpu_cores | int) > 0
      - (minikube_node_profiles.platform.memory_gib | int) > 0
      - (minikube_node_profiles.platform.disk_gib | int) > 0
      - (minikube_node_profiles.llm.cpu_cores | int) > 0
      - (minikube_node_profiles.llm.memory_gib | int) > 0
      - (minikube_node_profiles.llm.disk_gib | int) > 0
      - (minikube_node_profiles.applications.cpu_cores | int) > 0
      - (minikube_node_profiles.applications.memory_gib | int) > 0
      - (minikube_node_profiles.applications.disk_gib | int) > 0
    fail_msg: "Некорректный профиль узлов Terraform; проверьте terraform/variables.tf."

- name: Проверка одинакового размера диска узлов
  ansible.builtin.assert:
    that:
      - minikube_node_profiles.platform.disk_gib == minikube_node_profiles.llm.disk_gib
      - minikube_node_profiles.platform.disk_gib == minikube_node_profiles.applications.disk_gib
    fail_msg: >-
      Minikube создаёт одинаковый размер диска для всех узлов.
      Укажите одинаковый disk_gib в Terraform.

- name: Расчёт параметров запуска
  ansible.builtin.set_fact:
    minikube_node_count: "{{ minikube_node_profiles | length }}"
    minikube_llm_node_name: "{{ (minikube_nodes | selectattr('role', 'equalto', 'llm') | list | first).name }}"
    minikube_apps_node_name: "{{ (minikube_nodes | selectattr('role', 'equalto', 'applications') | list | first).name }}"
    minikube_platform_cpu: "{{ minikube_node_profiles.platform.cpu_cores | int }}"
    minikube_platform_memory: "{{ minikube_node_profiles.platform.memory_gib | int }}"
    minikube_platform_disk: "{{ minikube_node_profiles.platform.disk_gib | int }}"
    minikube_platform_memory_mb: "{{ (minikube_node_profiles.platform.memory_gib | int) * 1024 }}"

- name: Создание каталога шифрования etcd
  ansible.builtin.file:
    path: "{{ minikube_encryption_dir }}"
    state: directory
    mode: "0700"

- name: Проверка файла EncryptionConfiguration
  ansible.builtin.stat:
    path: "{{ minikube_encryption_file }}"
  register: minikube_encryption_stat

- name: Генерация ключа шифрования etcd
  ansible.builtin.shell: openssl rand -base64 32 | tr -d '\n'
  args:
    executable: /bin/bash
  changed_when: false
  register: minikube_encryption_key
  when: not minikube_encryption_stat.stat.exists

- name: Запись EncryptionConfiguration
  ansible.builtin.copy:
    content: |
      apiVersion: apiserver.config.k8s.io/v1
      kind: EncryptionConfiguration
      resources:
        - resources:
            - secrets
          providers:
            - aescbc:
                keys:
                  - name: key1
                    secret: {{ minikube_encryption_key.stdout }}
            - identity: {}
    dest: "{{ minikube_encryption_file }}"
    mode: "0600"
  when: not minikube_encryption_stat.stat.exists

- name: Проверка состояния контейнера платформенного узла
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Status{{ '}}' }}"
      - minikube
  changed_when: false
  failed_when: false
  register: minikube_container_state

- name: Проверка файла EncryptionConfiguration в узле
  ansible.builtin.command:
    argv:
      - docker
      - cp
      - "minikube:{{ minikube_node_encryption_file }}"
      - "{{ minikube_encryption_probe_file }}"
  changed_when: false
  failed_when: false
  register: minikube_encryption_probe
  when: minikube_container_state.rc == 0

- name: Определение наличия шифрования в узле
  ansible.builtin.set_fact:
    minikube_node_has_encryption: >-
      {{ (minikube_container_state.rc == 0) and ((minikube_encryption_probe.rc | default(1)) == 0) }}

- name: Удаление временного файла проверки
  ansible.builtin.file:
    path: "{{ minikube_encryption_probe_file }}"
    state: absent

- name: Формирование аргументов запуска Minikube
  ansible.builtin.set_fact:
    minikube_start_argv: >-
      {{ ['minikube', 'start',
          '--profile=minikube',
          '--driver=docker',
          '--nodes=' ~ (minikube_node_count | string),
          '--cpus=' ~ (minikube_platform_cpu | string),
          '--memory=' ~ (minikube_platform_memory_mb | string),
          '--disk-size=' ~ (minikube_platform_disk | string) ~ 'g']
         + (['--gpus', 'all'] if (minikube_gpu_available | bool) else [])
         + (['--extra-config=apiserver.encryption-provider-config=' ~ minikube_node_encryption_file]
            if (minikube_node_has_encryption | bool) else [])
         + ['--mount', '--mount-string=' ~ repo_root ~ '/volumes:/volumes'] }}

- name: Запуск Minikube по профилю Terraform
  ansible.builtin.command:
    argv: "{{ minikube_start_argv }}"

- name: Установка EncryptionConfiguration в узел
  ansible.builtin.command:
    argv:
      - minikube
      - ssh
      - -n
      - minikube
      - --
      - sudo
      - install
      - -m
      - "0600"
      - "{{ minikube_mount_encryption_file }}"
      - "{{ minikube_node_encryption_file }}"

- name: Перезапуск Minikube для включения шифрования etcd
  when: not (minikube_node_has_encryption | bool)
  block:
    - name: Остановка Minikube
      ansible.builtin.command:
        argv:
          - minikube
          - stop
          - --profile=minikube

    - name: Запуск Minikube с шифрованием etcd
      ansible.builtin.command:
        argv: >-
          {{ minikube_start_argv
             + ['--extra-config=apiserver.encryption-provider-config=' ~ minikube_node_encryption_file] }}

- name: Ограничение ресурсов узлов по профилю Terraform
  ansible.builtin.command:
    argv:
      - docker
      - update
      - "--cpus={{ minikube_node_profiles[item.role].cpu_cores | int }}"
      - "--memory={{ minikube_node_profiles[item.role].memory_gib | int }}g"
      - "--memory-swap={{ minikube_node_profiles[item.role].memory_gib | int }}g"
      - "{{ item.name }}"
  loop: "{{ minikube_nodes }}"
  loop_control:
    label: "{{ item.name }} ({{ item.role }})"

- name: Выбор контекста kubectl
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - use-context
      - minikube
  changed_when: false

- name: Ожидание готовности узлов
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Ready
      - node
      - --all
      - --timeout=5m
  changed_when: false

- name: Маркировка узлов по назначению
  ansible.builtin.command:
    argv:
      - kubectl
      - label
      - node
      - "{{ item.name }}"
      - "{{ minikube_node_label_key }}={{ item.label }}"
      - --overwrite
  loop: "{{ minikube_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Маркировка узла LLM для GPU
  ansible.builtin.command:
    argv:
      - kubectl
      - label
      - node
      - "{{ minikube_llm_node_name }}"
      - "platform.gpu={{ minikube_gpu_available | bool | lower }}"
      - --overwrite
  changed_when: false

- name: Снятие старого taint с узла LLM
  ansible.builtin.command:
    argv:
      - kubectl
      - taint
      - node
      - "{{ minikube_llm_node_name }}"
      - "workload=applications:NoSchedule-"
  changed_when: false
  failed_when: false

- name: Резервирование узла приложений
  ansible.builtin.command:
    argv:
      - kubectl
      - taint
      - node
      - "{{ minikube_apps_node_name }}"
      - "{{ minikube_application_taint }}"
      - --overwrite
  changed_when: false

- name: Список системных DaemonSet
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - daemonset
      - -n
      - kube-system
      - -o
      - "jsonpath={.items[*].metadata.name}"
  changed_when: false
  register: minikube_system_daemonsets

- name: Разрешение системным DaemonSet работать на зарезервированных узлах
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - daemonset
      - "{{ item }}"
      - -n
      - kube-system
      - --type=merge
      - -p
      - '{"spec":{"template":{"spec":{"tolerations":[{"operator":"Exists"}]}}}}'
  loop: "{{ minikube_system_daemonsets.stdout.split() }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Проверка аргументов kube-apiserver
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pod
      - kube-apiserver-minikube
      - -n
      - kube-system
      - -o
      - "jsonpath={.spec.containers[0].command}"
  changed_when: false
  register: minikube_apiserver_command

- name: Проверка включения шифрования Secret в etcd
  ansible.builtin.assert:
    that:
      - "'encryption-provider-config' in minikube_apiserver_command.stdout"
    fail_msg: >-
      kube-apiserver запущен без encryption-provider-config. Проверьте
      {{ minikube_node_encryption_file }} в узле minikube и повторите операцию 1.

- name: Перешифрование существующих Secret
  ansible.builtin.shell: kubectl get secrets --all-namespaces -o json | kubectl replace -f -
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: not (minikube_node_has_encryption | bool)

- name: Проверка записи Secret в etcd
  ansible.builtin.shell: |
    set -e
    kubectl create secret generic encryption-probe --from-literal=value=probe -n default >/dev/null
    etcdctl_path="$(command -v etcdctl || true)"
    if [ -z "$etcdctl_path" ]; then
      etcdctl_path="$(ls /var/lib/minikube/binaries/*/etcdctl 2>/dev/null | head -1 || true)"
    fi
    if [ -z "$etcdctl_path" ]; then
      echo "etcdctl-not-found"
      exit 0
    fi
    certs=/var/lib/minikube/certs/etcd
    if [ ! -d "$certs" ]; then certs=/etc/kubernetes/pki/etcd; fi
    ETCDCTL_API=3 "$etcdctl_path" \
      --cacert="$certs/ca.crt" --cert="$certs/server.crt" --key="$certs/server.key" \
      get /registry/secrets/default/encryption-probe | tr -d '\000' | head -c 300
  args:
    executable: /bin/bash
  register: minikube_etcd_probe
  changed_when: false
  failed_when: false

- name: Удаление проверочного Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - delete
      - secret
      - encryption-probe
      - -n
      - default
      - --ignore-not-found
  changed_when: false

- name: Итог проверки шифрования etcd
  ansible.builtin.debug:
    msg: >-
      {{ 'Secret в etcd зашифрован (aescbc).'
         if 'k8s:enc:' in (minikube_etcd_probe.stdout | default(''))
         else 'Проверить шифрование напрямую не удалось: ' ~ (minikube_etcd_probe.stdout | default('') | trim) }}

- name: Настройка параметров ядра для Elasticsearch
  ansible.builtin.command:
    argv:
      - minikube
      - ssh
      - -n
      - minikube
      - --
      - sudo
      - sysctl
      - -w
      - "{{ minikube_elasticsearch_sysctl }}"
  changed_when: false
  failed_when: false
  register: minikube_sysctl

- name: Предупреждение о параметрах ядра
  ansible.builtin.debug:
    msg: >-
      Не удалось задать {{ minikube_elasticsearch_sysctl }} в узле minikube.
      Elasticsearch может не запуститься: проверьте bootstrap-проверку vm.max_map_count.
  when: minikube_sysctl.rc != 0

- name: Включение metrics-server
  ansible.builtin.command:
    argv:
      - minikube
      - addons
      - enable
      - metrics-server
  changed_when: false

- name: Итог запуска Minikube
  ansible.builtin.debug:
    msg: >-
      {{ 'Minikube запущен по ресурсному профилю Terraform. NVIDIA GPU будет включён для llama.cpp после установки device plugin.'
         if (minikube_gpu_available | bool)
         else 'Minikube запущен по ресурсному профилю Terraform. llama.cpp будет использовать CPU.' }}
