---
- name: Чтение списка методов auth
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - env
      - "VAULT_TOKEN={{ vault_root_token }}"
      - vault
      - auth
      - list
      - -format=json
  register: vault_auth_list
  changed_when: false
  failed_when: false
  no_log: true

- name: Включение метода auth kubernetes
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - env
      - "VAULT_TOKEN={{ vault_root_token }}"
      - vault
      - auth
      - enable
      - kubernetes
  no_log: true
  when: "'kubernetes/' not in (vault_auth_list.stdout | default('{}') | from_json)"

- name: Настройка метода auth kubernetes
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - env
      - "VAULT_TOKEN={{ vault_root_token }}"
      - vault
      - write
      - auth/kubernetes/config
      - kubernetes_host=https://kubernetes.default.svc
  no_log: true

- name: Чтение списка секретных движков
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - env
      - "VAULT_TOKEN={{ vault_root_token }}"
      - vault
      - secrets
      - list
      - -format=json
  register: vault_secrets_list
  changed_when: false
  failed_when: false
  no_log: true

- name: Включение kv-v2
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - env
      - "VAULT_TOKEN={{ vault_root_token }}"
      - vault
      - secrets
      - enable
      - -path=kv
      - kv-v2
  no_log: true
  when: "'kv/' not in (vault_secrets_list.stdout | default('{}') | from_json)"

- name: Поиск файлов политик Vault
  ansible.builtin.set_fact:
    vault_policy_files: "{{ query('ansible.builtin.fileglob', repo_root + '/k8s/charts/secret/templates/policies/_*.txt') }}"

- name: Запись политик Vault
  ansible.builtin.shell: >-
    kubectl exec -i -n {{ vault_namespace }} {{ vault_pod }} --
    env VAULT_TOKEN={{ vault_root_token }}
    vault policy write {{ item | basename | regex_replace('^_', '') | regex_replace('\.txt$', '') }} -
    < "{{ item }}"
  args:
    executable: /bin/bash
  loop: "{{ vault_policy_files }}"
  loop_control:
    label: "{{ item | basename }}"
  no_log: true

- name: Настройка ролей Kubernetes auth
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - env
      - "VAULT_TOKEN={{ vault_root_token }}"
      - vault
      - write
      - "auth/kubernetes/role/platform-{{ item }}"
      - bound_service_account_names=default
      - "bound_service_account_namespaces={{ item }}"
      - "policies=platform-{{ item }}"
      - ttl=1h
  loop: "{{ vault_auth_roles }}"
  no_log: true

- name: Запись политики cluster-operator
  ansible.builtin.shell: >-
    kubectl exec -i -n {{ vault_namespace }} {{ vault_pod }} --
    env VAULT_TOKEN={{ vault_root_token }}
    vault policy write cluster-operator - < "{{ role_path }}/files/cluster-operator.hcl"
  args:
    executable: /bin/bash
  no_log: true

- name: Создание ограниченного Vault CLI token
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - env
      - "VAULT_TOKEN={{ vault_root_token }}"
      - vault
      - token
      - create
      - -format=json
      - "-ttl={{ vault_operator_ttl }}"
      - -no-default-policy
      - -policy=cluster-operator
  register: vault_operator_token_raw
  no_log: true

- name: Вывод unseal keys и Vault CLI token
  ansible.builtin.debug:
    msg:
      - "Сохраните три любых unseal key в защищённом месте:"
      - "{{ vault_init_unseal_keys[:3] | join(', ') }}"
      - ""
      - "Временный Vault CLI token (действует 7 дней):"
      - "{{ (vault_operator_token_raw.stdout | from_json).auth.client_token }}"
      - "Для Vault CLI используйте VAULT_ADDR=http://127.0.0.1:8200 и этот token."

- name: Завершение настройки Vault
  ansible.builtin.debug:
    msg: >-
      Первичная настройка Vault завершена. Добавьте значения секретов приложений
      в KV v2 согласно README.md, дождитесь синхронизации VSO и запустите
      операцию 1 для установки сервисов.
