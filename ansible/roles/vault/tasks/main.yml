---
- name: Проверка обязательных команд
  ansible.builtin.shell: command -v {{ item }}
  args:
    executable: /bin/bash
  loop:
    - kubectl
    - jq
  changed_when: false
  failed_when: false
  register: vault_required_commands

- name: Проверка наличия команд
  ansible.builtin.assert:
    that:
      - vault_required_commands.results | selectattr('rc', 'ne', 0) | list | length == 0
    fail_msg: >-
      Не найдены команды:
      {{ vault_required_commands.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}.

- name: Проверка namespace Vault
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - namespace
      - "{{ vault_namespace }}"
  changed_when: false
  failed_when: false
  register: vault_namespace_check

- name: Проверка pod Vault
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pod
      - "{{ vault_pod }}"
      - -n
      - "{{ vault_namespace }}"
  changed_when: false
  failed_when: false
  register: vault_pod_check

- name: Проверка установки Vault
  ansible.builtin.assert:
    that:
      - vault_namespace_check.rc == 0
      - vault_pod_check.rc == 0
    fail_msg: "Vault не установлен. Сначала выполните операцию 1 или 4."

- name: Ожидание запуска pod Vault
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - "--for=jsonpath={.status.phase}=Running"
      - "pod/{{ vault_pod }}"
      - -n
      - "{{ vault_namespace }}"
      - --timeout=5m
  changed_when: false

- name: Чтение состояния Vault
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - vault
      - status
      - -format=json
  register: vault_status_raw
  changed_when: false
  failed_when: false

- name: Проверка читаемости состояния Vault
  ansible.builtin.assert:
    that:
      - vault_status_raw.stdout | length > 0
    fail_msg: "Не удалось получить состояние Vault. Проверьте pod vault-0."

- name: Разбор состояния Vault
  ansible.builtin.set_fact:
    vault_initialized: "{{ (vault_status_raw.stdout | from_json).initialized }}"
    vault_sealed: "{{ (vault_status_raw.stdout | from_json).sealed }}"

- name: Инициализация Vault
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - vault
      - operator
      - init
      - -format=json
  register: vault_init_raw
  no_log: true
  when: not (vault_initialized | bool)

- name: Разбор данных инициализации Vault
  ansible.builtin.set_fact:
    vault_root_token: "{{ (vault_init_raw.stdout | from_json).root_token }}"
    vault_init_unseal_keys: "{{ (vault_init_raw.stdout | from_json).unseal_keys_b64 }}"
    vault_initialized_now: true
  no_log: true
  when: not (vault_initialized | bool)

- name: Определение необходимости разблокировки
  ansible.builtin.set_fact:
    vault_needs_unseal: "{{ (vault_sealed | bool) or (vault_initialized_now | default(false) | bool) }}"

- name: Определение ключей для разблокировки
  ansible.builtin.set_fact:
    vault_keys_to_use: >-
      {{ (vault_init_unseal_keys if (vault_initialized_now | default(false) | bool)
          else (vault_unseal_keys_input | select('ne', '') | list)) }}
  no_log: true
  when: vault_needs_unseal | bool

- name: Проверка количества unseal keys
  ansible.builtin.assert:
    that:
      - (vault_keys_to_use | length) >= 3
    fail_msg: "Vault запечатан. Передайте три unseal keys при запуске операции."
  no_log: true
  when: vault_needs_unseal | bool

- name: Разблокировка Vault
  ansible.builtin.shell: printf '%s\n' "{{ item }}" | kubectl exec -i -n {{ vault_namespace }} {{ vault_pod }} -- vault operator unseal
  args:
    executable: /bin/bash
  loop: "{{ vault_keys_to_use[:3] }}"
  loop_control:
    label: "unseal key"
  no_log: true
  when: vault_needs_unseal | bool

- name: Повторное чтение состояния Vault
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - vault
      - status
      - -format=json
  register: vault_status_after
  changed_when: false
  failed_when: false

- name: Проверка разблокировки Vault
  ansible.builtin.assert:
    that:
      - vault_status_after.stdout | length > 0
      - (vault_status_after.stdout | from_json).initialized | bool
      - not ((vault_status_after.stdout | from_json).sealed | bool)
    fail_msg: "Vault остался запечатанным или не инициализирован."

- name: Информация о готовом Vault
  ansible.builtin.debug:
    msg: "Vault уже инициализирован и разблокирован."
  when: not (vault_initialized_now | default(false) | bool)

- name: Настройка Vault
  ansible.builtin.include_tasks: configure.yml
  when: vault_initialized_now | default(false) | bool
