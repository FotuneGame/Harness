---
# Релиз Helm из k8s/<chart> с values-<env>.yaml; release.args — аргументы helm,
# release.logins — значения из ключа username Secret.

# Helm не пересоздаёт Job с прежним содержимым: упавший Job (например,
# миграции GitLab) удаляется, чтобы повторный up запустил его заново.
- name: "Helm: {{ release.name }} — перезапуск упавших Job"
  ansible.builtin.shell: |
    kubectl get jobs -n "$NAMESPACE" -o json \
      | jq -r --arg release "$RELEASE" '.items[]
          | select(.metadata.annotations["meta.helm.sh/release-name"] == $release)
          | select(any(.status.conditions[]?; .type == "Failed" and .status == "True"))
          | .metadata.name' \
      | xargs -r kubectl delete job -n "$NAMESPACE"
  environment:
    NAMESPACE: "{{ release.namespace | default(release.chart) }}"
    RELEASE: "{{ release.name }}"
  register: platform_failed_jobs
  changed_when: platform_failed_jobs.stdout | length > 0

- name: "Helm: {{ release.name }} — логины из Vault"
  ansible.builtin.shell: >-
    kubectl get secret -n {{ release.namespace | default(release.chart) }} {{ item.value }}
    -o jsonpath='{.data.username}' | base64 -d
  loop: "{{ release.logins | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  register: platform_logins

- name: "Helm: {{ release.name }} (ход установки: kubectl get pods -n {{ release.namespace | default(release.chart) }})"
  ansible.builtin.command:
    argv: >-
      {{ ['bash', role_path ~ '/files/retry-downloading.sh', release.namespace | default(release.chart),
          'helm', 'upgrade', '--install', release.name, platform_charts ~ '/' ~ release.chart,
          '--kube-context', platform_context,
          '--namespace', release.namespace | default(release.chart),
          '--values', platform_charts ~ '/' ~ release.chart ~ '/values-' ~ platform_env ~ '.yaml',
          '--take-ownership', '--timeout', release.timeout | default('20m')]
         + (['--wait'] if release.wait | default(true) else [])
         + (release.args | default([]))
         + platform_logins.results | map(attribute='item.key')
           | zip(platform_logins.results | map(attribute='stdout') | map('to_json'))
           | map('join', '=') | map('regex_replace', '^', '--set-json=') | list }}
  environment:
    RETRY_ATTEMPTS: "{{ platform_wait_attempts }}"
  # Лимит фоновой задачи больше суммы попыток, чтобы ошибку сообщил сам Helm.
  async: "{{ ((release.timeout | default('20m') | regex_replace('m$', '') | int) * platform_wait_attempts + 10) * 60 }}"
  poll: 15
