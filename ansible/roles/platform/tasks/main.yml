---
- name: Проверка окружения Helm
  ansible.builtin.assert:
    that: platform_env in ['dev', 'stage', 'prod']
    fail_msg: "Окружение должно быть dev, stage или prod."

- name: Проверка, что у каждого обязательного секрета есть начальное значение
  ansible.builtin.assert:
    # Пустой результат шаблона ansible-core превращает в None.
    that: missing | default('', true) | trim | length == 0
    fail_msg: "Нет значений в platform_vault_seed для: {{ missing }}"
  vars:
    missing: >-
      {% for secrets in platform_vault_secrets.values() -%}
      {% for secret in secrets.values() if not secret.optional | default(false) and secret.path not in platform_vault_seed -%}
      {{ secret.path }} {% endfor %}{% endfor %}

- name: Параметры из Terraform
  ansible.builtin.command: terraform -chdir={{ platform_repo }}/terraform output -json ansible
  changed_when: false
  register: platform_tf_raw

- name: Разбор параметров Terraform
  ansible.builtin.set_fact:
    platform_tf: "{{ platform_tf_raw.stdout | from_json }}"

- name: Выбор контекста kubectl
  ansible.builtin.command: kubectl config use-context {{ platform_context }}
  changed_when: false

- name: Шифрование Secret в etcd включено
  ansible.builtin.command: >-
    kubectl get pod -n kube-system kube-apiserver-minikube
    -o jsonpath={.spec.containers[0].command}
  changed_when: false
  register: platform_apiserver
  failed_when: "'encryption-provider-config' not in platform_apiserver.stdout"

# Пока сеть подов (kindnet) не готова, kubelet пересоздаёт sandbox подов и
# перезапускает их контейнеры: сервисы ставятся после готовности сети и DNS.
- name: Ожидание сети подов
  ansible.builtin.command: kubectl wait pod -n kube-system -l app=kindnet --for=condition=Ready --timeout=15m
  changed_when: false

# coredns, запущенный до сети подов, уходит в CrashLoopBackOff с паузами до
# 5 минут: если он не готов, перезапускаем его, а не ждём.
- name: Ожидание DNS кластера
  ansible.builtin.shell: |
    kubectl wait pod -n kube-system -l k8s-app=kube-dns --for=condition=Ready --timeout=2m && exit 0
    kubectl rollout restart deployment/coredns -n kube-system
    kubectl rollout status deployment/coredns -n kube-system --timeout=10m
  changed_when: false

- name: Зависимости charts
  ansible.builtin.include_tasks: dependencies.yml

- name: Namespaces, StorageClass и PersistentVolume
  ansible.builtin.include_tasks: release.yml
  vars:
    release: { name: platform-foundation, chart: foundation, namespace: default }

- name: TLS-сертификат ingress в namespace
  ansible.builtin.shell: >-
    kubectl create secret tls {{ platform_proxy_values.tlsSecret }} --namespace {{ item }}
    --cert={{ platform_tls_dir }}/tls.crt --key={{ platform_tls_dir }}/tls.key
    --dry-run=client -o yaml | kubectl apply -f -
  loop: "{{ platform_tls_namespaces }}"
  register: platform_tls_secret
  changed_when: "'unchanged' not in platform_tls_secret.stdout"

# Vault становится ready только после разблокировки, поэтому без --wait.
- name: Vault и Vault Secrets Operator
  ansible.builtin.include_tasks: release.yml
  vars:
    release: { name: platform-secret, chart: secret, wait: false }

- name: Инициализация и настройка Vault
  ansible.builtin.include_tasks: vault.yml

- name: Ожидание секретов из Vault
  ansible.builtin.shell: |
    for secret in {{ platform_required_secrets }}; do
      kubectl get secret -n "${secret%%/*}" "${secret#*/}" >/dev/null 2>&1 || { echo "$secret"; exit 1; }
    done
  changed_when: false
  register: platform_secrets
  until: platform_secrets.rc == 0
  retries: 30
  delay: 10

- name: Ingress NGINX и маршруты *.local
  ansible.builtin.include_tasks: release.yml
  vars:
    release: { name: platform-proxy, chart: proxy }

- name: GPU для llama.cpp
  ansible.builtin.include_tasks: gpu.yml

# Токен Runner появляется только после ручной регистрации в GitLab.
- name: Наличие токена GitLab Runner
  ansible.builtin.command: kubectl get secret -n cicd gitlab-runner-credentials
  changed_when: false
  failed_when: false
  register: platform_runner_secret

- name: Включение GitLab Runner
  ansible.builtin.set_fact:
    platform_runner: "{{ platform_runner_secret.rc == 0 }}"

- name: Сервисы платформы
  ansible.builtin.include_tasks: release.yml
  loop: "{{ platform_releases }}"
  loop_control:
    loop_var: release
    label: "{{ release.name }}"

- name: Итог
  ansible.builtin.debug:
    msg: >-
      Кластер ({{ platform_env }}) развёрнут{{ '' if platform_runner else '; GitLab Runner выключен до записи
      cicd/gitlab-runner в Vault' }}. Доступ из браузера: ./cluster.sh ports open.
