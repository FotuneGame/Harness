---
- name: Ожидание запуска Vault
  ansible.builtin.command: >-
    kubectl wait pod/vault-0 -n secret --for=jsonpath={.status.phase}=Running --timeout=10m
  changed_when: false
  register: platform_vault_pod
  until: platform_vault_pod.rc == 0
  retries: 12
  delay: 5

- name: Состояние Vault
  ansible.builtin.command: kubectl exec -n secret vault-0 -- vault status -format=json
  changed_when: false
  failed_when: platform_vault_status.stdout | length == 0
  register: platform_vault_status
  until: platform_vault_status.stdout | length > 0
  retries: 12
  delay: 5

# Настройка (политики, роли, начальные секреты) применяется заново, если
# изменился шаблон или списки секретов: хеш хранится в ConfigMap vault-config.
- name: Применённая настройка Vault
  ansible.builtin.command: kubectl get configmap -n secret vault-config -o jsonpath={.data.hash}
  changed_when: false
  failed_when: false
  register: platform_vault_applied

- name: Нужна ли настройка Vault
  ansible.builtin.set_fact:
    platform_vault: "{{ platform_vault_status.stdout | from_json }}"
    platform_vault_hash: >-
      {{ (lookup('ansible.builtin.file', role_path ~ '/templates/vault-init.sh.j2')
          ~ (platform_vault_secrets | to_json) ~ (platform_vault_seed | to_json)) | hash('sha256') }}

- name: Нужна ли настройка Vault (итог)
  ansible.builtin.set_fact:
    platform_vault_setup: "{{ not platform_vault.initialized or platform_vault_applied.stdout != platform_vault_hash }}"

# Root token по unseal key требует enable_unauthenticated_access из
# k8s/secret/values.yaml: конфигурация читается только при запуске pod.
- name: Перезапуск Vault с новой конфигурацией
  ansible.builtin.shell: |
    kubectl exec -n secret vault-0 -- grep -q enable_unauthenticated_access /tmp/storageconfig.hcl && exit 0
    kubectl delete pod -n secret vault-0
    kubectl wait pod/vault-0 -n secret --for=jsonpath={.status.phase}=Running --timeout=10m
    until kubectl exec -n secret vault-0 -- vault status >/dev/null 2>&1 || [ $? -eq 2 ]; do sleep 2; done
    echo restarted
  register: platform_vault_restart
  changed_when: "'restarted' in platform_vault_restart.stdout"
  when: platform_vault.initialized and platform_vault_setup

- name: Vault запечатан после перезапуска
  ansible.builtin.set_fact:
    platform_vault: "{{ platform_vault | combine({'sealed': true}) }}"
  when: platform_vault_restart is changed

# Ключи нужны после каждого перезапуска pod и для root token при настройке.
- name: Ввод unseal key
  ansible.builtin.pause:
    prompt: "{{ 'Unseal key' if platform_vault.sealed else 'Настройка Vault изменилась, unseal key' }} ({{ item }} из 3)"
    echo: false
  loop: [1, 2, 3]
  register: platform_unseal_keys
  no_log: true
  when: platform_vault.initialized and (platform_vault.sealed or platform_vault_setup)

- name: Разблокировка Vault
  ansible.builtin.command:
    argv: [kubectl, exec, -i, -n, secret, vault-0, --, sh, -c, 'read -r key; vault operator unseal "$key"']
    stdin: "{{ item.user_input }}"
  loop: "{{ platform_unseal_keys.results }}"
  no_log: true
  when: platform_vault.initialized and platform_vault.sealed

- name: Настройка Vault
  when: platform_vault_setup
  block:
    - name: Инициализация Vault
      ansible.builtin.command: kubectl exec -n secret vault-0 -- vault operator init -format=json
      register: platform_vault_init
      no_log: true
      when: not platform_vault.initialized

    - name: Ключи Vault
      ansible.builtin.set_fact:
        platform_vault_keys: "{{ (platform_vault_init.stdout | from_json).unseal_keys_b64 }}"
        platform_vault_root: "{{ (platform_vault_init.stdout | from_json).root_token }}"
      no_log: true
      when: not platform_vault.initialized

    - name: Сохраните unseal keys (показываются один раз)
      ansible.builtin.debug:
        msg:
          - "Unseal keys (любые 3 из 5 нужны после каждого запуска кластера):"
          - "{{ platform_vault_keys }}"
      when: not platform_vault.initialized

    - name: Временный root token по unseal key
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -i
          - -n
          - secret
          - vault-0
          - --
          - sh
          - -ec
          - |
            vault operator generate-root -cancel >/dev/null 2>&1 || true
            otp=$(vault operator generate-root -generate-otp)
            nonce=$(vault operator generate-root -init -otp="$otp" -format=json | sed -n 's/.*"nonce": *"\([^"]*\)".*/\1/p')
            while read -r key; do
              encoded=$(vault operator generate-root -nonce="$nonce" -format=json "$key" | sed -n 's/.*"encoded_token": *"\([^"]*\)".*/\1/p')
            done
            vault operator generate-root -decode="$encoded" -otp="$otp"
        stdin: "{{ platform_unseal_keys.results | map(attribute='user_input') | join('\n') }}"
      register: platform_vault_generated
      no_log: true
      when: platform_vault.initialized

    - name: Root token
      ansible.builtin.set_fact:
        platform_vault_root: "{{ platform_vault_generated.stdout | trim }}"
      no_log: true
      when: platform_vault.initialized

    - name: Пароль admin
      ansible.builtin.set_fact:
        platform_vault_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Настройка Vault (политики, роли, admin, начальные секреты)
      ansible.builtin.command:
        argv: [kubectl, exec, -i, -n, secret, vault-0, --, sh, -s]
        stdin: "{{ lookup('ansible.builtin.template', 'vault-init.sh.j2') }}"
      register: platform_vault_configure
      no_log: true

    - name: Пароль пользователя admin (показывается один раз)
      ansible.builtin.debug:
        msg: "Vault UI https://vault.local: метод Userpass, пользователь admin, пароль {{ platform_vault_admin_password }}"
      when: "'admin-created' in platform_vault_configure.stdout"

    - name: Запись применённой настройки
      ansible.builtin.shell: >-
        kubectl create configmap vault-config -n secret --from-literal=hash={{ platform_vault_hash }}
        --dry-run=client -o yaml | kubectl apply -f -
  rescue:
    - name: Ошибка настройки Vault
      ansible.builtin.fail:
        msg: >-
          Настройка Vault не завершена{{ ': ' ~ (platform_vault_configure.stderr | default('') | trim) if platform_vault_configure.stderr | default('') }}.
          Повторите ./cluster.sh up — он спросит 3 unseal key и продолжит настройку.
