---
platform_repo: "{{ playbook_dir | dirname }}"
platform_charts: "{{ platform_repo }}/k8s"
# Параметры кластера из Terraform (output ansible): профиль, доли VRAM.
platform_context: "{{ platform_tf.profile }}"
platform_is_wsl: "{{ 'microsoft' in ansible_facts.kernel | lower }}"

# Окружение Helm: dev, stage или prod (./cluster.sh up <env>).
platform_env: dev

# Сервисы в порядке установки (foundation, secret и proxy ставятся раньше).
# Namespace совпадает с именем chart; релиз gitlab задаёт имена ресурсов GitLab.
platform_releases:
  - { name: platform-db, chart: db }
  - { name: platform-mb, chart: mb }
  - { name: platform-acl, chart: acl }
  - { name: platform-backup, chart: backup }
  - name: platform-llm
    chart: llm
    args: [--set, "llama.gpu.enabled={{ platform_gpu | string | lower }}", --set, "llama.gpu.memoryMiB={{ platform_llms_vram }}"]
  - { name: platform-logs, chart: logs }
  - { name: gitlab, chart: vcs }
  - { name: platform-cicd, chart: cicd, args: [--set, "gitlab-runner.enabled={{ platform_runner | string | lower }}"] }
  # После cicd: политика монтирования папок использует CRD Kyverno.
  - { name: platform-app, chart: app }

platform_proxy_values: "{{ lookup('file', platform_charts + '/proxy/values.yaml') | from_yaml }}"
platform_tls_dir: "{{ platform_repo }}/volumes/proxy/tls"
platform_tls_namespaces: "{{ (platform_proxy_values.routes | map(attribute='namespace') | list + ['vcs']) | unique }}"

# Секреты, которые Vault Secrets Operator синхронизирует в namespace.
platform_vault_secrets: "{{ (lookup('file', platform_charts + '/secret/values.yaml') | from_yaml).secrets }}"
# "namespace/имя" обязательных Secret через пробел.
platform_required_secrets: >-
  {% for namespace, secrets in platform_vault_secrets.items() -%}
  {% for name, secret in secrets.items() if not secret.optional | default(false) -%}
  {{ namespace }}/{{ name }} {% endfor %}{% endfor %}

# Значения секретов, которые записываются в Vault при его инициализации;
# null — случайный пароль из 32 символов. Пути — из k8s/secret/values.yaml.
platform_vault_seed:
  db/postgresql: { password: null }
  db/gitlab: { password: null }
  db/keycloak: { password: null }
  db/postgres-exporter: { password: null }
  db/pgadmin: { password: null }
  db/redis: { password: null }
  db/clickhouse: { password: null }
  vcs/gitlab-root: { password: null }
  acl/keycloak: { password: null }
  backup/minio: { rootUser: admin, rootPassword: null }
  backup/minio-gitlab: { secretKey: null }
  backup/minio-k8up: { secretKey: null }
  backup/restic: { password: null }
  logs/grafana: { admin-user: admin, admin-password: null }
  logs/smtp: { password: change-me }
