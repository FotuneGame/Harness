---
platform_repo: "{{ playbook_dir | dirname }}"
platform_charts: "{{ platform_repo }}/k8s"
platform_context: "{{ platform_tf.profile }}"
platform_is_wsl: "{{ 'microsoft' in ansible_facts.kernel | lower }}"

platform_env: dev

# Повторы ожидания (helm --wait, kubectl wait), пока скачиваются образы и файлы.
platform_wait_attempts: 12
platform_retry: "bash {{ role_path }}/files/retry-downloading.sh"

# Порядок установки; namespace = имя chart. logins — значения Helm, которые chart
# не читает из Secret: берутся из ключа username Secret (из Vault) namespace релиза.
platform_releases:
  - name: platform-db
    chart: db
    logins: { pgadmin4.env.email: pgadmin-credentials, clickhouse.auth.username: clickhouse-credentials }
  - { name: platform-mb, chart: mb }
  - { name: platform-acl, chart: acl, logins: { keycloak.auth.adminUser: keycloak-credentials } }
  - { name: platform-backup, chart: backup }
  - name: platform-llm
    chart: llm
    args: [--set, "llama.gpu.enabled={{ platform_gpu | string | lower }}", --set, "llama.gpu.memoryMiB={{ platform_llms_vram }}"]
  - name: platform-logs
    chart: logs
    logins: { kube-prometheus-stack.alertmanager.config.global.smtp_auth_username: smtp-credentials }
  - { name: gitlab, chart: vcs, logins: { global.psql.username: gitlab-db-credentials } }
  - { name: platform-cicd, chart: cicd, args: [--set, "gitlab-runner.enabled={{ platform_runner | string | lower }}"] }
  # После cicd: политика монтирования папок использует CRD Kyverno.
  - { name: platform-app, chart: app }

platform_dependency_charts: "{{ ['foundation', 'secret', 'proxy', 'gpu'] + platform_releases | map(attribute='chart') | list }}"

platform_proxy_values: "{{ lookup('file', platform_charts + '/proxy/values.yaml') | from_yaml }}"
platform_tls_dir: "{{ platform_repo }}/volumes/proxy/tls"
platform_tls_namespaces: "{{ (platform_proxy_values.routes | map(attribute='namespace') | list + ['vcs']) | unique }}"
# Имена *.local, которые CoreDNS направляет на Service ingress-контроллера.
platform_hostnames: "{{ platform_proxy_values.routes | map(attribute='host') | list + platform_proxy_values.extraHosts }}"
platform_ingress_service: "{{ platform_proxy_values['ingress-nginx'].fullnameOverride }}-controller.proxy.svc.cluster.local"
# ConfigMap с CA *.local: DaemonSet node-hosts (proxy) и задачи GitLab Runner (cicd).
platform_ca_namespaces: [proxy, cicd]

platform_vault_secrets: "{{ (lookup('file', platform_charts + '/secret/values.yaml') | from_yaml).secrets }}"
# "namespace/имя" обязательных Secret через пробел.
platform_required_secrets: >-
  {% for namespace, secrets in platform_vault_secrets.items() -%}
  {% for name, secret in secrets.items() if not secret.optional | default(false) -%}
  {{ namespace }}/{{ name }} {% endfor %}{% endfor %}

# Записываются в Vault при инициализации; null — случайный пароль из 32 символов.
# Логины postgres, redis, gitlab-root и argocd задаёт сам сервис (здесь — для справки).
platform_vault_seed:
  db/postgresql: { username: postgres, password: null }
  db/gitlab: { username: gitlab, password: null }
  db/keycloak: { username: keycloak, password: null }
  db/postgres-exporter: { username: postgres_exporter, password: null }
  db/pgadmin: { username: admin@example.com, password: null }
  db/redis: { username: default, password: null }
  db/clickhouse: { username: default, password: null }
  vcs/gitlab-root: { username: root, password: null }
  acl/keycloak: { username: admin, password: null }
  backup/minio: { username: admin, password: null }
  backup/minio-gitlab: { username: gitlab, password: null }
  backup/minio-k8up: { username: k8up, password: null }
  backup/restic: { password: null }
  logs/grafana: { username: admin, password: null }
  logs/smtp: { username: infra-alerts@example.com, password: change-me }
  cicd/argocd: { username: admin, password: null }
  app/postgresql: { username: app, password: null }
  app/clickhouse: { username: app, password: null }
  app/minio: { username: app, password: null }
