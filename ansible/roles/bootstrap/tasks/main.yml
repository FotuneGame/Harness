---
- name: Проверка прерванных операций dpkg
  ansible.builtin.command: dpkg --audit
  register: dpkg_audit
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Обновление индексов пакетов Debian
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Исправление незавершённых зависимостей пакетов Debian
  ansible.builtin.command: apt-get -y --fix-broken install
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: dpkg_repair
  changed_when: dpkg_repair.rc == 0
  when:
    - ansible_facts['os_family'] == "Debian"
    - dpkg_audit.stdout | length > 0

- name: Повторная проверка состояния dpkg
  ansible.builtin.command: dpkg --audit
  register: dpkg_audit_after_repair
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

- name: Завершение прерванной настройки пакетов dpkg
  ansible.builtin.command: dpkg --configure -a
  environment:
    DEBIAN_FRONTEND: noninteractive
  when:
    - ansible_facts['os_family'] == "Debian"
    - dpkg_audit_after_repair.stdout | length > 0

- name: Установка базовых пакетов
  ansible.builtin.package:
    name: "{{ base_packages }}"
    state: present

- name: Установка Docker
  ansible.builtin.package:
    name: "{{ 'docker.io' if ansible_facts['os_family'] == 'Debian' else 'docker' }}"
    state: present
  when:
    - install_docker
    - ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Создание основной группы пользователя кластера
  ansible.builtin.group:
    name: "{{ cluster_user }}"
    state: present
  when: "'microsoft' in ansible_facts['kernel'] | lower"

- name: Создание пользователя кластера в WSL
  ansible.builtin.user:
    name: "{{ cluster_user }}"
    group: "{{ cluster_user }}"
    shell: /bin/bash
    create_home: true
    groups:
      - sudo
    append: true
    state: present
  when: "'microsoft' in ansible_facts['kernel'] | lower"

- name: Разрешение пользователю кластера запускать административные команды
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ cluster_user }}"
    content: "{{ cluster_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: "'microsoft' in ansible_facts['kernel'] | lower"

- name: Передача пользователю кластера Terraform workspace
  ansible.builtin.file:
    path: "{{ repo_root }}/terraform"
    owner: "{{ cluster_user }}"
    group: "{{ cluster_user }}"
    recurse: true
    state: directory
  when: "'microsoft' in ansible_facts['kernel'] | lower"

- name: Передача пользователю кластера каталога томов
  ansible.builtin.file:
    path: "{{ repo_root }}/volumes"
    owner: "{{ cluster_user }}"
    group: "{{ cluster_user }}"
    state: directory
  when: "'microsoft' in ansible_facts['kernel'] | lower"

- name: Создание группы docker
  ansible.builtin.group:
    name: docker
    state: present
  when: install_docker

- name: Добавление пользователя в группу docker
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
  when: install_docker

- name: Сбор сведений о системных службах
  ansible.builtin.service_facts:
  when: install_docker

- name: Запуск службы Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: install_docker and 'docker.service' in ansible_facts.services

- name: Проверка NVIDIA GPU на Linux-хосте
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi_check
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"

- name: Добавление ключа репозитория NVIDIA Container Toolkit
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey |
      gpg --dearmor --yes -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Добавление репозитория NVIDIA Container Toolkit
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    mode: "0644"
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Привязка репозитория NVIDIA к ключу подписи
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    regexp: "^deb https://"
    replace: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://"
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Установка NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Проверка runtime NVIDIA в Docker
  ansible.builtin.command: docker info --format "{{ '{{' }}json .Runtimes{{ '}}' }}"
  register: docker_runtimes
  changed_when: false
  failed_when: false
  when:
    - install_docker
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Настройка runtime NVIDIA в Docker
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  when:
    - install_docker
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0
    - "'nvidia' not in (docker_runtimes.stdout | default(''))"
  notify: Перезапуск службы Docker

- name: Проверка наличия Minikube
  ansible.builtin.command: minikube version
  register: minikube_check
  changed_when: false
  failed_when: false

- name: Установка Minikube, если он отсутствует
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
    dest: /usr/local/bin/minikube
    mode: "0755"
  when: minikube_check.rc != 0

- name: Проверка наличия kubectl
  ansible.builtin.command: kubectl version --client
  register: kubectl_check
  changed_when: false
  failed_when: false

- name: Получение актуальной версии kubectl
  ansible.builtin.command: curl -fsSL https://dl.k8s.io/release/stable.txt
  register: kubectl_stable_version
  changed_when: false
  when: kubectl_check.rc != 0

- name: Установка kubectl, если он отсутствует
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_stable_version.stdout }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
  when: kubectl_check.rc != 0

- name: Установка Helm
  ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Проверка установленной версии Terraform
  ansible.builtin.command: terraform version
  register: terraform_check
  changed_when: false
  failed_when: false

- name: Определение установленной версии Terraform
  ansible.builtin.set_fact:
    installed_terraform_version: >-
      {{ (terraform_check.stdout | regex_findall('Terraform v([0-9.]+)') | first) | default('0.0.0', true) }}

- name: Загрузка архива Terraform
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"
    dest: "/tmp/terraform_{{ terraform_version }}_linux_amd64.zip"
    mode: "0644"
    timeout: 120
  register: terraform_archive
  retries: 3
  delay: 5
  until: terraform_archive is succeeded
  when:
    - terraform_check.rc != 0 or installed_terraform_version is version(terraform_version, '<', version_type='loose')

- name: Установка или обновление Terraform
  ansible.builtin.unarchive:
    src: "/tmp/terraform_{{ terraform_version }}_linux_amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
  when:
    - terraform_check.rc != 0 or installed_terraform_version is version(terraform_version, '<', version_type='loose')

- name: Удаление архива Terraform
  ansible.builtin.file:
    path: "/tmp/terraform_{{ terraform_version }}_linux_amd64.zip"
    state: absent
  when:
    - terraform_check.rc != 0 or installed_terraform_version is version(terraform_version, '<', version_type='loose')

- name: Установка Vault CLI
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    creates: /usr/local/bin/vault

- name: Настройка конфигурации WSL
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/configure-wsl-conf.py {{ cluster_user }}"
  register: wsl_conf_result
  when: "'microsoft' in ansible_facts['kernel'] | lower"

- name: Подсказка о перезапуске WSL
  ansible.builtin.debug:
    msg: >-
      Параметры /etc/wsl.conf обновлены. Чтобы применить настройки, выполните
      wsl.exe --shutdown в Windows и откройте WSL заново от пользователя {{ cluster_user }}.
  when:
    - "'microsoft' in ansible_facts['kernel'] | lower"
    - "'updated' in (wsl_conf_result.stdout | default(''))"

- name: Проверка прав пользователя cluster на репозиторий
  ansible.builtin.shell: |
    status=0
    sudo --user={{ cluster_user }} test -x "{{ repo_root }}" || status=1
    sudo --user={{ cluster_user }} test -r "{{ repo_root }}/ansible/cluster.yml" || status=1
    sudo --user={{ cluster_user }} test -w "{{ repo_root }}/terraform" || status=1
    sudo --user={{ cluster_user }} test -w "{{ repo_root }}/volumes" || status=1
    for file in terraform/terraform.tfstate terraform/terraform.tfstate.backup; do
      if [ -e "{{ repo_root }}/$file" ] && ! sudo --user={{ cluster_user }} test -w "{{ repo_root }}/$file"; then status=1; fi
    done
    if [ -d "{{ repo_root }}/terraform/.terraform" ] && ! sudo --user={{ cluster_user }} test -w "{{ repo_root }}/terraform/.terraform"; then status=1; fi
    exit "$status"
  args:
    executable: /bin/bash
  register: wsl_repo_permissions
  changed_when: false
  failed_when: false
  when: "'microsoft' in ansible_facts['kernel'] | lower"

- name: Ошибка при недостаточных правах на репозиторий
  ansible.builtin.fail:
    msg: >-
      Пользователь {{ cluster_user }} создан, но не имеет нужных прав на репозиторий.
      Проверьте права WSL-диска с репозиторием и повторите настройку.
  when:
    - "'microsoft' in ansible_facts['kernel'] | lower"
    - wsl_repo_permissions.rc | default(0) != 0
