---
- name: Установка базовых пакетов (Debian)
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Установка базовых пакетов (RedHat)
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Проверка наличия Docker
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Установка Docker (Debian)
  ansible.builtin.apt:
    name: docker.io
    state: present
  when: install_docker and docker_check.rc != 0 and ansible_facts['os_family'] == "Debian"

- name: Установка Docker (RedHat)
  ansible.builtin.dnf:
    name: docker
    state: present
  when: install_docker and docker_check.rc != 0 and ansible_facts['os_family'] == "RedHat"

- name: Создание группы docker
  ansible.builtin.group:
    name: docker
    state: present
  when: install_docker

- name: Добавление пользователя в группу docker
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
  when: install_docker

- name: Сбор сведений о системных службах
  ansible.builtin.service_facts:
  when: install_docker

- name: Запуск службы Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: install_docker and 'docker.service' in ansible_facts.services

- name: Проверка NVIDIA GPU на Linux-хосте
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi_check
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"

- name: Добавление ключа репозитория NVIDIA Container Toolkit
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey |
      gpg --dearmor --yes -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Добавление репозитория NVIDIA Container Toolkit
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    mode: "0644"
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Привязка репозитория NVIDIA к ключу подписи
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    regexp: "^deb https://"
    replace: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://"
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Установка NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Проверка runtime NVIDIA в Docker
  ansible.builtin.command: docker info --format "{{ '{{' }}json .Runtimes{{ '}}' }}"
  register: docker_runtimes
  changed_when: false
  failed_when: false
  when:
    - install_docker
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0

- name: Настройка runtime NVIDIA в Docker
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  when:
    - install_docker
    - ansible_facts['os_family'] == "Debian"
    - "'microsoft' not in ansible_facts['kernel'] | lower"
    - nvidia_smi_check.rc | default(1) == 0
    - "'nvidia' not in (docker_runtimes.stdout | default(''))"
  notify: Перезапуск службы Docker

- name: Проверка наличия Minikube
  ansible.builtin.command: minikube version
  register: minikube_check
  changed_when: false
  failed_when: false

- name: Установка Minikube, если он отсутствует
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
    dest: /usr/local/bin/minikube
    mode: "0755"
  when: minikube_check.rc != 0

- name: Проверка наличия kubectl
  ansible.builtin.command: kubectl version --client
  register: kubectl_check
  changed_when: false
  failed_when: false

- name: Получение актуальной версии kubectl
  ansible.builtin.command: curl -fsSL https://dl.k8s.io/release/stable.txt
  register: kubectl_stable_version
  changed_when: false
  when: kubectl_check.rc != 0

- name: Установка kubectl, если он отсутствует
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_stable_version.stdout }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
  when: kubectl_check.rc != 0

- name: Установка Helm
  ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Установка Terraform
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    creates: /usr/local/bin/terraform

- name: Установка Vault CLI
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    creates: /usr/local/bin/vault
