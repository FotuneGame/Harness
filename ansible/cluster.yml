---
- name: Управление локальным кластером
  hosts: local
  gather_facts: true
  vars_prompt:
    - name: cluster_action
      prompt: |
        Выберите операцию:
        1) Настройка и запуск кластера
        2) Генерация ключей для Vault (первичная инициализация)
        3) Остановка кластера
        4) Перезагрузка кластера
        5) Включение проброса порта для доступа к сервисам кластера
        6) Выключение проброса порта для доступа к сервисам кластера
      private: false
      default: "1"
  vars:
    repo_root: "{{ playbook_dir }}/.."
    is_wsl: "{{ 'microsoft' in (ansible_facts['kernel'] | lower) }}"
  tasks:
    - name: Проверка выбранной операции
      ansible.builtin.assert:
        that:
          - cluster_action in ['1', '2', '3', '4', '5', '6']
        fail_msg: "Укажите номер операции от 1 до 6."

    - name: Проверка пользователя WSL для управления кластером
      ansible.builtin.assert:
        that:
          - ansible_user_id == 'cluster'
        fail_msg: >-
          В WSL запустите wsl.exe --shutdown в Windows, откройте WSL заново,
          проверьте whoami и повторите playbook от пользователя cluster.
      when:
        - is_wsl | bool
        - cluster_action != '1'

    - name: Определение абсолютного пути репозитория
      ansible.builtin.command: realpath {{ repo_root }}
      changed_when: false
      register: repo_realpath

    - name: Абсолютный путь репозитория
      ansible.builtin.set_fact:
        repo_root: "{{ repo_realpath.stdout }}"

    - name: Подготовка системных зависимостей и пользователя
      when: cluster_action == '1'
      become: true
      block:
        - name: Установка системных зависимостей и CLI
          ansible.builtin.import_role:
            name: bootstrap

    - name: Остановка после подготовки первого запуска WSL
      ansible.builtin.fail:
        msg: >-
          Первый этап подготовки завершён. Выполните wsl.exe --shutdown
          в Windows, откройте WSL заново от пользователя cluster и снова
          запустите этот playbook для продолжения настройки.
      when:
        - cluster_action == '1'
        - is_wsl | bool
        - ansible_user_id != 'cluster'

    - name: Инициализация Terraform
      ansible.builtin.command:
        argv:
          - terraform
          - -chdir=terraform
          - init
      args:
        chdir: "{{ repo_root }}"
      environment:
        TF_CLI_CONFIG_FILE: "{{ repo_root }}/terraform/.terraformrc"
      when: cluster_action == '1'

    - name: Проверка профиля ресурсов Terraform
      ansible.builtin.command:
        argv:
          - terraform
          - -chdir=terraform
          - apply
          - -auto-approve
      args:
        chdir: "{{ repo_root }}"
      environment:
        TF_CLI_CONFIG_FILE: "{{ repo_root }}/terraform/.terraformrc"
      when: cluster_action == '1'

    - name: Запуск Minikube по профилю Terraform
      ansible.builtin.include_role:
        name: minikube
      when: cluster_action in ['1', '4']

    - name: Ожидание запуска Vault
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - "--for=jsonpath={.status.phase}=Running"
          - pod/vault-0
          - -n
          - secret
          - --timeout=10m
      changed_when: false
      when: cluster_action in ['2', '4']

    - name: Установка базовых charts и Vault
      ansible.builtin.include_role:
        name: platform
      vars:
        platform_bootstrap_only: true
      when: cluster_action == '1'

    - name: Проверка состояния Vault
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - secret
          - vault-0
          - --
          - vault
          - status
          - -format=json
      register: vault_status
      changed_when: false
      failed_when: false
      when: cluster_action in ['1', '2', '4']

    - name: Определение состояния Vault
      ansible.builtin.set_fact:
        vault_initialized: "{{ (vault_status.stdout | from_json).initialized | default(false) }}"
        vault_sealed: "{{ (vault_status.stdout | from_json).sealed | default(false) }}"
      when:
        - cluster_action in ['1', '2', '4']
        - vault_status.stdout | length > 0

    - name: Запрос первого unseal key
      ansible.builtin.pause:
        prompt: "Введите первый unseal key Vault"
        echo: false
      register: vault_unseal_key_1
      no_log: true
      when:
        - cluster_action in ['1', '2', '4']
        - vault_initialized | default(false) | bool
        - vault_sealed | default(false) | bool

    - name: Запрос второго unseal key
      ansible.builtin.pause:
        prompt: "Введите второй unseal key Vault"
        echo: false
      register: vault_unseal_key_2
      no_log: true
      when:
        - cluster_action in ['1', '2', '4']
        - vault_initialized | default(false) | bool
        - vault_sealed | default(false) | bool

    - name: Запрос третьего unseal key
      ansible.builtin.pause:
        prompt: "Введите третий unseal key Vault"
        echo: false
      register: vault_unseal_key_3
      no_log: true
      when:
        - cluster_action in ['1', '2', '4']
        - vault_initialized | default(false) | bool
        - vault_sealed | default(false) | bool

    - name: Инициализация, разблокировка и настройка Vault
      ansible.builtin.include_role:
        name: vault
      vars:
        vault_unseal_keys_input:
          - "{{ vault_unseal_key_1.user_input | default('') }}"
          - "{{ vault_unseal_key_2.user_input | default('') }}"
          - "{{ vault_unseal_key_3.user_input | default('') }}"
      when: cluster_action in ['1', '2', '4']

    - name: Развёртывание сервисов при наличии Vault secrets
      ansible.builtin.include_role:
        name: platform
      when: cluster_action in ['1', '4']

    - name: Вывод следующего шага после настройки Vault
      ansible.builtin.debug:
        msg: >-
          Vault настроен. Добавьте секреты из README.md в KV v2, затем
          повторите эту операцию для завершения развёртывания сервисов.
      when:
        - cluster_action in ['1', '4']
        - platform_secrets_missing | default(false) | bool

    - name: Подтверждение готового развёртывания
      ansible.builtin.debug:
        msg: "Кластер запущен; charts и сервисы установлены."
      when:
        - cluster_action in ['1', '4']
        - not (platform_secrets_missing | default(false) | bool)

    - name: Выключение проброса ingress перед остановкой
      ansible.builtin.include_role:
        name: ingress
        tasks_from: stop
      when: cluster_action == '3'

    - name: Остановка Minikube
      ansible.builtin.command:
        argv:
          - minikube
          - stop
          - -p
          - minikube
      when: cluster_action == '3'

    - name: Подтверждение остановки Minikube
      ansible.builtin.debug:
        msg: "Кластер остановлен."
      when: cluster_action == '3'

    - name: Включение проброса порта для доступа к кластеру
      ansible.builtin.include_role:
        name: ingress
        tasks_from: start
      when: cluster_action == '5'

    - name: Подтверждение проброса порта
      ansible.builtin.debug:
        msg: "Проброс HTTPS 443 и HTTP 80 включён."
      when: cluster_action == '5'

    - name: Выключение проброса порта для доступа к кластеру
      ansible.builtin.include_role:
        name: ingress
        tasks_from: stop
      when: cluster_action == '6'

    - name: Подтверждение остановки проброса порта
      ansible.builtin.debug:
        msg: "Проброс ingress-портов выключен."
      when: cluster_action == '6'
