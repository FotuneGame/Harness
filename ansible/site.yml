---
- name: Подготовка рабочей станции
  hosts: local
  become: true
  vars:
    terraform_version: "1.10.5"
    vault_version: "1.18.5"
    minikube_version: "v1.34.0"
    install_docker: true
    docker_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
    base_packages:
      - curl
      - git
      - unzip
      - tar
      - ca-certificates
      - gnupg
      - conntrack
      - socat
      - jq
      - python3
      - python3-pip
  roles:
    - bootstrap
